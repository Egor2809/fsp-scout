openapi: 3.1.0
info:
  title: Скаут API
  version: 0.1.0
  summary: Платформа обратного найма ИТ-специалистов с верифицированным профилем ФСП
  description: |
    Контракт API «Скаута» (спецтрек ФСП, ЛЦТ 2026). Фронтенд генерирует из него типизированный
    клиент и моки (orval), бэкенд (FastAPI) реализует его строго по этому файлу.

    ## Соглашения
    - Базовый путь: `/api/v1`. Все тела запросов и ответов в JSON (UTF-8), кроме загрузки резюме
      (`multipart/form-data`) и PDF-профиля (`application/pdf`).
    - Идентификаторы: UUID v4 строкой. Даты и время: RFC 3339 в UTC (`2026-10-05T09:30:00Z`),
      календарные даты: `YYYY-MM-DD`.
    - Перечисления: `snake_case` латиницей. Подписи на русском фронтенд берёт из своего словаря
      или из `GET /taxonomy`.
    - **Деньги:** целые рубли в месяц «на руки» (net). Вилка (`SalaryRange`) обязательна везде,
      где она есть по ТЗ: потребность, поиск, инвайт, вакансия, ожидания кандидата.
      Правило `from ≤ to` проверяется сервером, нарушение даёт `422 salary_range_invalid`.
    - Поля, отсутствующие по смыслу, приходят как `null` (а не пропускаются), если в схеме
      они перечислены в `required`.
    - Пагинация: `page` (с 1) и `page_size` (1–100, по умолчанию 20); ответ `{items, total, page, page_size}`.
    - **Ошибки:** RFC 9457 `application/problem+json` (схема `Problem`). Машинный ключ ошибки в поле `code`,
      фронтенд ветвится только по нему. Ошибки валидации: `422 validation_error` со списком `errors[]`
      (JSON Pointer на поле запроса).

    ## Авторизация и роли
    OIDC (Keycloak, realm `scout`, Authorization Code + PKCE). В API передаётся access token
    `Authorization: Bearer <JWT>`. Роли — realm roles: `candidate`, `employer`, `admin`.
    Роль, которой доступна операция, указана в расширении `x-roles`. Проверка владения на каждом эндпоинте:
    кандидат видит только свои инвайты, отклики, тесты и задания; работодатель видит только инвайты,
    вакансии, подборки и задания своей компании. Чужой объект возвращает `404 not_found`
    (не `403`), чтобы не раскрывать его существование.

    Пользователь создаётся при первом запросе `GET /me` по данным токена (provisioning).

    ## Приватность и раскрытие контактов
    - Работодатель до раскрытия получает только анонимную карточку `CandidateCard` с `contacts: null`.
      Нет ФИО, фото, возраста, контактов; названия компаний в опыте скрыты, если так настроил кандидат.
    - Контакты (`CandidateContacts`) раскрываются компании только после `invitation.accepted`
      или после отклика кандидата на вакансию этой компании (`application.created`).
      Каждое раскрытие пишется в журнал аудита.
    - Кандидат, скрывший профиль от компании (`hidden_company_ids`), для неё не существует:
      `404` в карточке, отсутствие в выдаче и банке.
    - Без подтверждённого грейда (пройденного теста) и без согласия `profile_visibility`
      кандидат не попадает в выдачу и банк.

    ## Инвайты: статусы и переходы
    ```
    draft ──► sent ──► viewed ──► accepted ──► interview ──► offer ──► hired
               │         │  ▲          │            │           │
               │         ▼  │          └────────────┴───────────┴──► closed
               │      postponed («не сейчас», один раз)
               └─────────┴──────► declined (кандидат, с причиной)
                                  expired  (система, по expires_at)
                                  withdrawn (работодатель)
    ```
    - Активные статусы: `sent`, `viewed`, `postponed`. Пока у компании есть активный инвайт
      кандидату, второй отправить нельзя (`409 already_invited`).
    - Кандидат: `view` (sent→viewed), `accept`, `decline` (с причиной), `postpone`.
    - Работодатель: `withdraw` (из активных), `stage` (после accepted: interview, offer, hired, closed).
    - Финальные статусы: `declined`, `expired`, `withdrawn`, `hired`, `closed`.
    - В MVP `POST /invitations` создаёт инвайт сразу в статусе `sent`; `draft` зарезервирован.
    - Каждый переход пишется в `events[]` (журнал), обе стороны видят актуальный статус.

    ## Порог кандидата и квота
    - Кандидат задаёт скрытый минимум `salary_floor`. Если `salary.to` инвайта меньше порога,
      инвайт не создаётся: `422 salary_below_floor`. Цифра порога работодателю не раскрывается.
      Проверить заранее можно через `POST /invitations/precheck` (ответ только булев,
      эндпоинт ограничен по частоте, чтобы порог нельзя было подобрать перебором).
    - Квота: лимит отправленных инвайтов на компанию за календарную неделю (пн–вс, Europe/Moscow),
      базово 20, растёт с долей принятых. Отозванный инвайт квоту не возвращает.
      Превышение: `429 quota_exceeded` с объектом `quota` в теле ошибки.

    ## Правила теста и пересдачи
    - Подтверждённый грейд меняется не чаще 1 раза в 90 дней. Повторная попытка на тот же грейд —
      через 30 дней. После провала сразу доступна одна попытка на грейд ниже.
    - Нарушение правил даёт `409 retake_locked` с `available_at`. Актуальные ограничения
      по каждому грейду отдаёт `GET /me/test-eligibility`.
  contact:
    name: Команда «Скаут»
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: Текущий хост (Caddy проксирует /api на FastAPI)
security:
  - bearerAuth: []
tags:
  - name: me
    description: Текущий пользователь, согласия, аккаунт
  - name: taxonomy
    description: Справочники
  - name: profile
    description: Профиль кандидата, резюме, приватность
  - name: assessment
    description: Опросы, тесты, история грейдов, витрина механики теста
  - name: fsp
    description: Интеграция с ФСП
  - name: company
    description: Компания работодателя
  - name: needs
    description: Потребности работодателя и рекомендации категорий
  - name: searches
    description: Подборки, версии, шорт-лист
  - name: candidates
    description: Банк кандидатов и карточки
  - name: invitations
    description: Инвайты с открытой вилкой
  - name: vacancies
    description: Вакансии и отклики
  - name: tasks
    description: Регулярные задания
  - name: service
    description: Сервисные эндпоинты (проверка PDF, режим жюри, вебхуки)

paths:
  # ───────────────────────────── me ─────────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Текущий пользователь
      description: Создаёт пользователя при первом обращении. Для кандидата возвращает состояние онбординга, для работодателя — компанию.
      x-roles: [candidate, employer, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Удалить аккаунт и данные
      description: Запускает удаление аккаунта и всех персональных данных (152-ФЗ). Профиль сразу скрывается из выдачи.
      x-roles: [candidate, employer]
      responses:
        '202':
          description: Удаление запланировано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletion' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/export:
    get:
      tags: [me]
      operationId: exportMyData
      summary: Экспорт своих данных (JSON)
      x-roles: [candidate, employer]
      responses:
        '200':
          description: Все данные пользователя одним JSON-документом
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/consents:
    get:
      tags: [me]
      operationId: getMyConsents
      summary: Документы согласий и текущее состояние
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [me]
      operationId: updateMyConsents
      summary: Дать или отозвать согласия
      description: |
        Три отдельных согласия, каждое версионируется. `given: false` отзывает согласие.
        Отзыв `profile_visibility` скрывает профиль из выдачи. Отзыв `fsp_data` отвязывает ФСП ID.
        `personal_data` через этот метод не отзывается (для этого `DELETE /me`), попытка даёт `422 validation_error`.
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentsUpdate' }
            examples:
              onboarding:
                summary: Все три согласия при регистрации
                value:
                  items:
                    - { type: personal_data, version: '2026-09', given: true }
                    - { type: profile_visibility, version: '2026-09', given: true }
                    - { type: fsp_data, version: '2026-09', given: false }
      responses:
        '200':
          description: Новое состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── taxonomy ─────────────────────────────
  /taxonomy:
    get:
      tags: [taxonomy]
      operationId: getTaxonomy
      summary: Справочники (специализации, грейды, отрасли, навыки с синонимами, города)
      security: []
      x-roles: [public]
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema: { type: string }
              description: '`public, max-age=3600`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Taxonomy' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /companies:
    get:
      tags: [taxonomy]
      operationId: lookupCompanies
      summary: Поиск компаний (для списка «скрыть профиль от компаний»)
      x-roles: [candidate]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
          description: Подстрока названия, пусто — первые компании по алфавиту
      responses:
        '200':
          description: До 20 компаний
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompanyBrief' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── profile ─────────────────────────────
  /me/profile:
    get:
      tags: [profile]
      operationId: getMyProfile
      summary: Свой профиль кандидата (полный, с контактами)
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [profile]
      operationId: updateMyProfile
      summary: Сохранить профиль (форма или проверенные поля из резюме)
      description: Навыки с `source` `test`/`fsp`/`task` сервер сохраняет сам и не даёт перезаписать; здесь передаются только заявленные (`self`, `resume`).
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateProfileUpdate' }
      responses:
        '200':
          description: Сохранённый профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/resume:
    post:
      tags: [profile]
      operationId: uploadMyResume
      summary: Загрузить PDF-резюме и получить распознанные поля
      description: |
        PDF до 5 МБ, проверяется MIME и сигнатура. Поля не сохраняются в профиль автоматически:
        кандидат проверяет их на экране сверки и сохраняет через `PUT /me/profile`.
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  contentMediaType: application/pdf
            encoding:
              file:
                contentType: application/pdf
      responses:
        '200':
          description: Распознанные поля с уверенностью
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeParseResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/profile.pdf:
    get:
      tags: [profile]
      operationId: downloadMyProfilePdf
      summary: Стандартизированный PDF-профиль с QR-кодом проверки
      x-roles: [candidate]
      responses:
        '200':
          description: PDF-файл
          headers:
            Content-Disposition:
              schema: { type: string }
              description: '`attachment; filename="scout-profile.pdf"`'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/card-preview:
    get:
      tags: [profile]
      operationId: getMyCardPreview
      summary: Как работодатель видит мою карточку
      description: Анонимная карточка с учётом текущих настроек приватности (`contacts` всегда `null`).
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/privacy:
    get:
      tags: [profile]
      operationId: getMyPrivacy
      summary: Настройки приватности
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [profile]
      operationId: updateMyPrivacy
      summary: Изменить настройки приватности
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacySettingsUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── assessment ─────────────────────────────
  /surveys:
    post:
      tags: [assessment]
      operationId: createSurvey
      summary: Пройти опрос (отрасль, специализация, стек, стаж, формат, ожидания)
      description: Данные опроса обновляют профиль (специализация, стек как `self`, формат, город, ожидания).
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyCreate' }
      responses:
        '201':
          description: Опрос сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/surveys:
    get:
      tags: [assessment]
      operationId: listMySurveys
      summary: История опросов (новые сверху)
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Survey' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/test-eligibility:
    get:
      tags: [assessment]
      operationId: getMyTestEligibility
      summary: Какие грейды можно выбрать сейчас и когда следующая попытка
      x-roles: [candidate]
      parameters:
        - name: specialization
          in: query
          required: false
          description: По умолчанию — из последнего опроса
          schema: { $ref: '#/components/schemas/Specialization' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestEligibility' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tests:
    post:
      tags: [assessment]
      operationId: startTest
      summary: Начать тест на заявленный грейд
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCreate' }
            example:
              declared_grade: middle
              specialization: backend
      responses:
        '201':
          description: Сессия теста создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '409':
          description: '`retake_locked` (с `available_at`), `test_in_progress`, `survey_required`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://scout.local/problems/retake-locked
                title: Пересдача пока недоступна
                status: 409
                code: retake_locked
                detail: Подтверждённый грейд можно менять не чаще одного раза в 90 дней.
                available_at: '2026-12-01T00:00:00Z'
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/tests:
    get:
      tags: [assessment]
      operationId: listMyTests
      summary: История тестов (новые сверху)
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestSessionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tests/{test_id}:
    parameters:
      - $ref: '#/components/parameters/TestId'
    get:
      tags: [assessment]
      operationId: getTest
      summary: Состояние сессии теста
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tests/{test_id}/next:
    parameters:
      - $ref: '#/components/parameters/TestId'
    get:
      tags: [assessment]
      operationId: getNextTestItem
      summary: Следующее задание (CAT)
      description: |
        Идемпотентно: пока на текущее задание нет ответа, возвращается оно же.
        Когда критерий остановки достигнут (SE(θ) < 0.35 после минимума заданий, или максимум,
        и практический блок сдан), возвращается `status: ready_to_finish` и `item: null`.
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestStep' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tests/{test_id}/answers:
    parameters:
      - $ref: '#/components/parameters/TestId'
    post:
      tags: [assessment]
      operationId: submitTestAnswer
      summary: Ответ на текущее задание
      description: Правильность ответа во время теста не раскрывается. `rt_ms`, вставки и потеря фокуса идут в модель времени ответа и флаги (не автоматический провал).
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerSubmit' }
      responses:
        '200':
          description: Ответ принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerAck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`test_not_active` (тест завершён или истёк) или ответ не на текущее задание'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tests/{test_id}/run:
    parameters:
      - $ref: '#/components/parameters/TestId'
    post:
      tags: [assessment]
      operationId: runTestCode
      summary: Прогнать код практического задания на открытых тестах (песочница)
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeRunRequest' }
      responses:
        '200':
          description: Результат прогона
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeRunResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tests/{test_id}/finish:
    parameters:
      - $ref: '#/components/parameters/TestId'
    post:
      tags: [assessment]
      operationId: finishTest
      summary: Завершить тест и получить результат
      description: Можно вызвать досрочно (оставшиеся задания считаются пропущенными). Повторный вызов возвращает тот же результат.
      x-roles: [candidate]
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tests/{test_id}/result:
    parameters:
      - $ref: '#/components/parameters/TestId'
    get:
      tags: [assessment]
      operationId: getTestResult
      summary: Результат завершённого теста
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/grade-history:
    get:
      tags: [assessment]
      operationId: getMyGradeHistory
      summary: История подтверждённых грейдов
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GradeHistoryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /assessment/families:
    get:
      tags: [assessment]
      operationId: listShowcaseFamilies
      summary: Витринные семейства заданий (экран «Как работает тест»)
      description: Только семейства со статусом `showcase`, выведенные из ротации, поэтому показ не создаёт утечку.
      x-roles: [candidate, employer, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemFamilyBrief' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /assessment/families/{family_id}:
    get:
      tags: [assessment]
      operationId: getShowcaseFamily
      summary: Семейство задания с тремя экземплярами и параметрами IRT
      x-roles: [candidate, employer, admin]
      parameters:
        - name: family_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemFamily' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── fsp ─────────────────────────────
  /me/fsp:
    get:
      tags: [fsp]
      operationId: getMyFsp
      summary: Мой профиль ФСП (достижения, индекс, разбивка)
      description: Если ФСП ID не привязан или истории нет, приходит `linked`/`has_history` = false, `index` = 0, `bonus` = 0 — это нормальный нейтральный случай, не ошибка.
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FspProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/fsp/link:
    post:
      tags: [fsp]
      operationId: linkMyFsp
      summary: Привязать ФСП ID и подтянуть достижения
      description: |
        В проде привязка идёт через client-initiated account linking Keycloak (IdP `fsp`),
        `fsp_id` сверяется с брокерской связью. Нужен `fsp_data` в согласиях (`403 consent_required`).
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FspLinkRequest' }
      responses:
        '200':
          description: Привязано, достижения синхронизированы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FspProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [fsp]
      operationId: unlinkMyFsp
      summary: Отвязать ФСП ID (достижения перестают учитываться)
      x-roles: [candidate]
      responses:
        '200':
          description: Отвязано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FspProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── company ─────────────────────────────
  /company:
    get:
      tags: [company]
      operationId: getMyCompany
      summary: Профиль своей компании
      x-roles: [employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [company]
      operationId: updateMyCompany
      summary: Изменить профиль компании
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /company/invitation-quota:
    get:
      tags: [company, invitations]
      operationId: getInvitationQuota
      summary: Квота инвайтов на текущую неделю
      x-roles: [employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationQuota' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /company/vacancies:
    get:
      tags: [company, vacancies]
      operationId: listMyCompanyVacancies
      summary: Вакансии своей компании (все статусы)
      x-roles: [employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vacancy' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── needs ─────────────────────────────
  /needs:
    post:
      tags: [needs]
      operationId: createNeed
      summary: Разобрать потребность из свободного текста
      description: |
        Текст разбирается в чипы (специализация, грейд, must/nice-навыки, формат, город, отрасль, вилка, если указана).
        LLM работает с маскированием ПДн, без ключей — фолбэк на правилах и словаре синонимов.
        Потребность создаётся черновиком; рекомендации доступны после подтверждения `PUT /needs/{need_id}`
        с обязательной вилкой.
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NeedCreate' }
            example:
              raw_text: Ищем бэкенд-разработчика на Go в платёжный сервис, нужен опыт с PostgreSQL и Kafka, желательно k8s. Гибрид, Москва, 250–320 тысяч на руки.
      responses:
        '201':
          description: Разобранная потребность (черновик)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Need' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /needs/{need_id}:
    parameters:
      - $ref: '#/components/parameters/NeedId'
    get:
      tags: [needs]
      operationId: getNeed
      summary: Потребность
      x-roles: [employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Need' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [needs]
      operationId: confirmNeed
      summary: Подтвердить отредактированные чипы и вилку
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NeedConfirm' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Need' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /needs/{need_id}/categories:
    parameters:
      - $ref: '#/components/parameters/NeedId'
    get:
      tags: [needs]
      operationId: getNeedCategories
      summary: Рекомендованные категории с числом кандидатов и салари-радаром
      x-roles: [employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeedCategories' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`need_not_confirmed` — потребность не подтверждена (нет вилки)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /salary-radar:
    get:
      tags: [needs]
      operationId: getSalaryRadar
      summary: Салари-радар для категории и вилки
      x-roles: [employer]
      parameters:
        - name: specialization
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Specialization' }
        - name: grade
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Grade' }
        - name: salary_from
          in: query
          required: true
          schema: { type: integer, minimum: 10000 }
        - name: salary_to
          in: query
          required: true
          schema: { type: integer, minimum: 10000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalaryRadar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── searches ─────────────────────────────
  /searches:
    get:
      tags: [searches]
      operationId: listSearches
      summary: Подборки компании (новые сверху)
      x-roles: [employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Search' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [searches]
      operationId: createSearch
      summary: Создать подборку (версия 1)
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchCreate' }
      responses:
        '201':
          description: Подборка создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Search' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /searches/{search_id}:
    parameters:
      - $ref: '#/components/parameters/SearchId'
    get:
      tags: [searches]
      operationId: getSearch
      summary: Подборка с версиями и шорт-листом
      x-roles: [employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Search' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [searches]
      operationId: refineSearch
      summary: Уточнить фильтры — создаёт новую версию, шорт-лист сохраняется
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRefine' }
      responses:
        '200':
          description: Подборка с новой текущей версией
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Search' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /searches/{search_id}/results:
    parameters:
      - $ref: '#/components/parameters/SearchId'
    get:
      tags: [searches]
      operationId: getSearchResults
      summary: Ранжированная выдача версии с объяснениями
      x-roles: [employer]
      parameters:
        - name: version
          in: query
          required: false
          description: По умолчанию — текущая версия
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /searches/{search_id}/shortlist/{candidate_id}:
    parameters:
      - $ref: '#/components/parameters/SearchId'
      - $ref: '#/components/parameters/CandidateId'
    put:
      tags: [searches]
      operationId: addToShortlist
      summary: Добавить кандидата в шорт-лист (идемпотентно)
      x-roles: [employer]
      responses:
        '200':
          description: Подборка с обновлённым шорт-листом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Search' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [searches]
      operationId: removeFromShortlist
      summary: Убрать кандидата из шорт-листа (идемпотентно)
      x-roles: [employer]
      responses:
        '200':
          description: Подборка с обновлённым шорт-листом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Search' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── candidates ─────────────────────────────
  /candidates:
    get:
      tags: [candidates]
      operationId: listCandidates
      summary: Банк кандидатов с фильтрами (анонимные карточки)
      x-roles: [employer]
      parameters:
        - name: specialization
          in: query
          schema: { $ref: '#/components/schemas/Specialization' }
        - name: grade
          in: query
          description: Можно несколько
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/Grade' }
        - name: skill
          in: query
          description: ID навыков, кандидат должен иметь все
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: work_format
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/WorkFormat' }
        - name: city
          in: query
          schema: { type: string, maxLength: 100 }
        - name: fsp_only
          in: query
          description: Только с достижениями ФСП
          schema: { type: boolean, default: false }
        - name: fsp_level_min
          in: query
          description: Минимальный уровень достижения ФСП
          schema: { $ref: '#/components/schemas/FspLevel' }
        - name: verified_only
          in: query
          description: Только с подтверждённым грейдом (по умолчанию да)
          schema: { type: boolean, default: true }
        - name: active_within_days
          in: query
          description: Актуальность — был активен за N дней
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [strength, percentile, recent]
            default: strength
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /candidates/{candidate_id}:
    parameters:
      - $ref: '#/components/parameters/CandidateId'
    get:
      tags: [candidates]
      operationId: getCandidate
      summary: Карточка кандидата (анонимная или раскрытая)
      description: '`contacts` заполнен, только если `disclosure.revealed = true` для компании текущего пользователя.'
      x-roles: [employer]
      parameters:
        - name: search_id
          in: query
          required: false
          description: Если передан, в ответе есть объяснение из этой подборки (`explanation`)
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── invitations ─────────────────────────────
  /invitations:
    get:
      tags: [invitations]
      operationId: listCompanyInvitations
      summary: Инвайты компании
      x-roles: [employer]
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/InvitationStatus' }
        - name: candidate_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Отправить инвайт с открытой вилкой
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreate' }
      responses:
        '201':
          description: Инвайт отправлен (статус `sent`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`already_invited`, `candidate_unavailable` (не ищет / профиль скрыт)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`salary_below_floor` (без раскрытия порога), `salary_range_invalid`, `validation_error`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                below_floor:
                  value:
                    type: https://scout.local/problems/salary-below-floor
                    title: Вилка ниже ожиданий кандидата
                    status: 422
                    code: salary_below_floor
                    detail: Верхняя граница вилки ниже минимального порога, который задал кандидат. Инвайт не отправлен.
        '429':
          description: '`quota_exceeded` (в теле `quota`) или `rate_limited`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /invitations/precheck:
    post:
      tags: [invitations]
      operationId: precheckInvitation
      summary: Проверить до отправки — вилка, квота, активный инвайт
      description: Ответ булев, порог кандидата не раскрывается. Ограничен по частоте (не больше 10 проверок на кандидата в час).
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationPrecheckRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPrecheck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /invitations/stats:
    get:
      tags: [invitations]
      operationId: getInvitationStats
      summary: Воронка и причины отказов компании
      x-roles: [employer]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 365, default: 90 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/invitations:
    get:
      tags: [invitations]
      operationId: listMyInvitations
      summary: Входящие инвайты кандидата
      x-roles: [candidate]
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/InvitationStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    get:
      tags: [invitations]
      operationId: getInvitation
      summary: Инвайт (кандидату — свой, работодателю — своей компании)
      x-roles: [candidate, employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations/{invitation_id}/view:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [invitations]
      operationId: markInvitationViewed
      summary: Отметить просмотр (sent → viewed, идемпотентно)
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations/{invitation_id}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: Принять — контакты раскрываются компании
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationAccept' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvitationNotActionable' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /invitations/{invitation_id}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [invitations]
      operationId: declineInvitation
      summary: Отклонить с причиной
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationDecline' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvitationNotActionable' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /invitations/{invitation_id}/postpone:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [invitations]
      operationId: postponeInvitation
      summary: «Не сейчас» — отложить до срока ответа (один раз)
      x-roles: [candidate]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationPostpone' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvitationNotActionable' }

  /invitations/{invitation_id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [invitations]
      operationId: withdrawInvitation
      summary: Отозвать активный инвайт
      x-roles: [employer]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationNote' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvitationNotActionable' }

  /invitations/{invitation_id}/stage:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [invitations]
      operationId: updateInvitationStage
      summary: Продвинуть после принятия (interview → offer → hired | closed)
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationStageUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvitationNotActionable' }

  # ───────────────────────────── vacancies ─────────────────────────────
  /vacancies:
    get:
      tags: [vacancies]
      operationId: listVacancies
      summary: Каталог опубликованных вакансий
      description: Для кандидата в каждой вакансии есть `match` (соответствие его профилю) и `my_application`.
      x-roles: [candidate, employer]
      parameters:
        - name: specialization
          in: query
          schema: { $ref: '#/components/schemas/Specialization' }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
        - name: work_format
          in: query
          schema: { $ref: '#/components/schemas/WorkFormat' }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [vacancies]
      operationId: createVacancy
      summary: Создать вакансию
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacancyInput' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vacancies/{vacancy_id}:
    parameters:
      - $ref: '#/components/parameters/VacancyId'
    get:
      tags: [vacancies]
      operationId: getVacancy
      summary: Вакансия
      x-roles: [candidate, employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [vacancies]
      operationId: updateVacancy
      summary: Изменить вакансию своей компании
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacancyInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vacancies/{vacancy_id}/apply:
    parameters:
      - $ref: '#/components/parameters/VacancyId'
    post:
      tags: [vacancies]
      operationId: applyToVacancy
      summary: Откликнуться (раскрывает контакты этой компании)
      x-roles: [candidate]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationCreate' }
      responses:
        '201':
          description: Отклик создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`already_applied`, `vacancy_closed`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vacancies/{vacancy_id}/applications:
    parameters:
      - $ref: '#/components/parameters/VacancyId'
    get:
      tags: [vacancies]
      operationId: listVacancyApplications
      summary: Отклики на вакансию, отсортированные скорингом
      x-roles: [employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmployerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vacancies/{vacancy_id}/test-blueprint:
    parameters:
      - $ref: '#/components/parameters/VacancyId'
    get:
      tags: [vacancies, assessment]
      operationId: getVacancyTestBlueprint
      summary: «Вакансия → бланк теста» (доли компетенций)
      description: Бланк строится из навыков и весов вакансии при её сохранении; этот метод отдаёт текущий.
      x-roles: [candidate, employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestBlueprint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/applications:
    get:
      tags: [vacancies]
      operationId: listMyApplications
      summary: Мои отклики
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /applications/{application_id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [vacancies]
      operationId: withdrawApplication
      summary: Отозвать свой отклик
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /applications/{application_id}/status:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [vacancies]
      operationId: updateApplicationStatus
      summary: Сменить статус отклика (работодатель)
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationStatusUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── tasks ─────────────────────────────
  /me/tasks:
    get:
      tags: [tasks]
      operationId: listMyTasks
      summary: Регулярные задания, назначенные мне
      description: Система раздаёт задания кандидатам подходящих категорий, не чаще одного в 2 недели на человека.
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getMyTask
      summary: Назначенное задание
      x-roles: [candidate]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{task_id}/submissions:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: submitTask
      summary: Сдать решение регулярного задания
      x-roles: [candidate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskSubmissionCreate' }
      responses:
        '201':
          description: Решение принято, предварительная оценка появится позже
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSubmission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`task_already_submitted` или срок истёк'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /regular-tasks:
    get:
      tags: [tasks]
      operationId: listCompanyTasks
      summary: Регулярные задания компании
      x-roles: [employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RegularTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tasks]
      operationId: createCompanyTask
      summary: Опубликовать регулярное задание
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegularTaskInput' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegularTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /regular-tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getCompanyTask
      summary: Регулярное задание компании
      x-roles: [employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegularTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /regular-tasks/{task_id}/submissions:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: listTaskSubmissions
      summary: Решения задания (анонимные карточки авторов, лучшие сверху)
      x-roles: [employer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmployerTaskSubmission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /regular-tasks/{task_id}/submissions/{submission_id}/score:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: submission_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [tasks]
      operationId: scoreTaskSubmission
      summary: Итоговая оценка решения по рубрике (последнее слово за человеком)
      x-roles: [employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskScore' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployerTaskSubmission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── service ─────────────────────────────
  /verify/{profile_token}:
    get:
      tags: [service]
      operationId: verifyProfile
      summary: Проверка подлинности PDF-профиля по QR
      security: []
      x-roles: [public]
      parameters:
        - name: profile_token
          in: path
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileVerification' }
        '404': { $ref: '#/components/responses/NotFound' }

  /eval/rank:
    post:
      tags: [service]
      operationId: evalRank
      summary: Режим проверки жюри — ранжирование внешних пар «вакансия–кандидат»
      description: 'Отдаёт top-K с объяснениями. `Accept: text/csv` — тот же результат в CSV.'
      x-roles: [admin, employer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvalRankRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalRankResponse' }
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /webhooks/fsp:
    post:
      tags: [service]
      operationId: fspWebhook
      summary: Вебхук реестра ФСП (achievement.created)
      security: []
      x-roles: [fsp-registry]
      parameters:
        - name: X-FSP-Signature
          in: header
          required: true
          description: HMAC-SHA256 тела запроса общим секретом
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FspWebhookEvent' }
      responses:
        '202':
          description: Принято в обработку
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Keycloak (realm `scout`)

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    TestId:
      name: test_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    NeedId:
      name: need_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SearchId:
      name: search_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VacancyId:
      name: vacancy_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: '`unauthorized` — нет или истёк токен'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://scout.local/problems/unauthorized
            title: Требуется вход
            status: 401
            code: unauthorized
    Forbidden:
      description: '`forbidden` — роль не подходит'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://scout.local/problems/forbidden
            title: Недостаточно прав
            status: 403
            code: forbidden
    ConsentRequired:
      description: '`consent_required` — не дано нужное согласие (в `consent_types`)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://scout.local/problems/consent-required
            title: Нужно согласие
            status: 403
            code: consent_required
            consent_types: [personal_data]
    NotFound:
      description: '`not_found` — объекта нет или он чужой'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://scout.local/problems/not-found
            title: Не найдено
            status: 404
            code: not_found
    Conflict:
      description: Конфликт состояния, конкретный `code` в теле
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvitationNotActionable:
      description: '`invitation_not_actionable` — переход недопустим из текущего статуса'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://scout.local/problems/invitation-not-actionable
            title: Действие недоступно
            status: 409
            code: invitation_not_actionable
            detail: Инвайт уже в статусе «Истёк».
    ValidationError:
      description: '`validation_error` (или `salary_range_invalid`) с перечнем полей'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://scout.local/problems/validation-error
            title: Проверьте поля
            status: 422
            code: validation_error
            errors:
              - pointer: /salary/to
                detail: Верхняя граница должна быть не меньше нижней
    PayloadTooLarge:
      description: '`file_too_large` — файл больше 5 МБ'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: '`unsupported_media_type` — нужен PDF'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: '`rate_limited` — слишком часто'
      headers:
        Retry-After:
          schema: { type: integer }
          description: Секунд до следующей попытки
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ───────────── errors ─────────────
    Problem:
      type: object
      description: RFC 9457 Problem Details. Допускаются дополнительные поля-расширения.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI типа проблемы
          examples: ['https://scout.local/problems/salary-below-floor']
        title:
          type: string
          description: Короткое описание для человека (на русском)
          examples: [Вилка ниже ожиданий кандидата]
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Подробности конкретного случая (на русском, можно показывать пользователю)
        instance:
          type: string
          format: uri-reference
        code: { $ref: '#/components/schemas/ProblemCode' }
        errors:
          type: array
          description: Ошибки по полям (для `validation_error`, `salary_range_invalid`)
          items: { $ref: '#/components/schemas/FieldError' }
        available_at:
          type: string
          format: date-time
          description: Для `retake_locked` — когда станет доступно
        consent_types:
          type: array
          description: Для `consent_required`
          items: { $ref: '#/components/schemas/ConsentType' }
        quota: { $ref: '#/components/schemas/InvitationQuota' }
        trace_id:
          type: string
          description: ID запроса для поддержки
      additionalProperties: true

    FieldError:
      type: object
      required: [pointer, detail]
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) на поле тела запроса
          examples: [/salary/from]
        detail:
          type: string
          examples: [Обязательное поле]

    ProblemCode:
      type: string
      description: Машинный код ошибки
      enum:
        - bad_request
        - validation_error
        - salary_range_invalid
        - unauthorized
        - forbidden
        - consent_required
        - not_found
        - conflict
        - salary_below_floor
        - quota_exceeded
        - already_invited
        - candidate_unavailable
        - invitation_not_actionable
        - retake_locked
        - test_in_progress
        - test_not_active
        - survey_required
        - need_not_confirmed
        - already_applied
        - vacancy_closed
        - task_already_submitted
        - fsp_not_found
        - fsp_already_linked
        - grade_unconfirmed
        - file_too_large
        - unsupported_media_type
        - rate_limited
        - internal_error

    # ───────────── enums ─────────────
    Role:
      type: string
      enum: [candidate, employer, admin]
    Specialization:
      type: string
      description: 'Backend, Frontend, Mobile, QA, DevOps/SRE, Data/ML, Аналитик'
      enum: [backend, frontend, mobile, qa, devops, data_ml, analyst]
    Grade:
      type: string
      description: 'Junior (до 1 года), Middle (1–3), Senior (3–6), Lead (6+)'
      enum: [junior, middle, senior, lead]
    WorkFormat:
      type: string
      enum: [office, hybrid, remote]
    Industry:
      type: string
      enum: [fintech, ecom, gov, telecom, gamedev, edtech, medtech, manufacturing, other]
    Availability:
      type: string
      description: 'Ищу активно / открыт к предложениям / не ищу'
      enum: [active, open, not_looking]
    ConsentType:
      type: string
      description: 'Обработка ПДн / показ профиля работодателям / получение данных ФСП'
      enum: [personal_data, profile_visibility, fsp_data]
    SkillLevel:
      type: string
      enum: [basic, confident, advanced]
    SkillSource:
      type: string
      description: 'self — заявлен, resume — из резюме, test — подтверждён тестом, fsp — из достижений ФСП, task — из регулярного задания'
      enum: [self, resume, test, fsp, task]
    InvitationStatus:
      type: string
      enum: [draft, sent, viewed, postponed, accepted, declined, expired, withdrawn, interview, offer, hired, closed]
    DeclineReason:
      type: string
      description: 'Вилка, стек, формат, компания, не ищу, другое'
      enum: [salary, stack, format, company, not_looking, other]
    ContactChannel:
      type: string
      enum: [email, phone, telegram]
    ApplicationStatus:
      type: string
      enum: [submitted, viewed, interview, offer, hired, rejected, withdrawn]
    VacancyStatus:
      type: string
      enum: [draft, published, closed]
    TestStatus:
      type: string
      enum: [in_progress, finished, expired, abandoned]
    TestOutcome:
      type: string
      description: 'passed — P(θ ≥ cut) ≥ 0.7; passed_confident — ещё и P(θ ≥ cut следующего) ≥ 0.7; failed'
      enum: [passed, passed_confident, failed]
    TestBlock:
      type: string
      description: 'A — адаптивный, B — практика, C — подход (опционально)'
      enum: [adaptive, practice, approach]
    ItemType:
      type: string
      enum: [single_choice, multiple_choice, short_answer, code, open_text]
    CodeLanguage:
      type: string
      enum: [python, go, javascript, typescript, java, sql, yaml, text]
    FspLevel:
      type: string
      description: 'Региональный / всероссийский / международный'
      enum: [regional, national, international]
    FspDiscipline:
      type: string
      description: 'Продуктовое / алгоритмическое / кибербезопасность / робототехника / БАС'
      enum: [product, algorithmic, cybersecurity, robotics, uas]
    FspResult:
      type: string
      description: 'Победитель / призёр / финалист / участник'
      enum: [winner, prize_winner, finalist, participant]
    FspFormat:
      type: string
      enum: [individual, team]
    TaskKind:
      type: string
      description: 'Мини-код / ревью фрагмента / «предложи подход»'
      enum: [code, review, approach]
    TaskAssignmentStatus:
      type: string
      enum: [assigned, submitted, reviewed, expired]
    FactorKind:
      type: string
      enum: [skills_coverage, confirmed_skills, semantic, industry, conditions, percentile, fsp, tasks, completeness, missing_skill, penalty]
    Polarity:
      type: string
      enum: [positive, negative, neutral]
    ProfileVisibility:
      type: string
      description: 'visible — в выдаче; hidden_no_grade — нет подтверждённого грейда; hidden_no_consent — нет согласия profile_visibility; hidden_by_candidate — кандидат «не ищу» и скрыл профиль'
      enum: [visible, hidden_no_grade, hidden_no_consent, hidden_by_candidate]
    DisclosureReason:
      type: string
      description: 'Почему компании раскрыты контакты'
      enum: [invitation_accepted, application]
    OnboardingStep:
      type: string
      enum: [consents, survey, grade, test, done]
    EligibilityReason:
      type: string
      description: 'grade_change_cooldown — 90 дней со смены грейда; retake_cooldown — 30 дней с попытки на этот грейд; lower_attempt_used — попытка на грейд ниже после провала уже использована; test_in_progress — есть незавершённый тест; survey_required — нет опроса'
      enum: [grade_change_cooldown, retake_cooldown, lower_attempt_used, test_in_progress, survey_required]

    # ───────────── common ─────────────
    SalaryRange:
      type: object
      description: Вилка в рублях в месяц на руки. `from ≤ to`, иначе 422 `salary_range_invalid`.
      required: [from, to]
      properties:
        from:
          type: integer
          minimum: 10000
          maximum: 10000000
          examples: [250000]
        to:
          type: integer
          minimum: 10000
          maximum: 10000000
          examples: [320000]
      examples:
        - { from: 250000, to: 320000 }

    Category:
      type: object
      description: Категория «специализация × грейд»
      required: [specialization, grade, label]
      properties:
        specialization: { $ref: '#/components/schemas/Specialization' }
        grade: { $ref: '#/components/schemas/Grade' }
        label:
          type: string
          examples: [Backend · Middle]

    SkillRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          examples: [go]
        name:
          type: string
          examples: [Go]

    CompanyBrief:
      type: object
      required: [id, name, industry, city, verified]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          examples: [Северный код]
        industry: { $ref: '#/components/schemas/Industry' }
        city:
          type: [string, 'null']
          examples: [Москва]
        verified:
          type: boolean
          description: Проверенный работодатель (ИНН/домен почты)

    PageMeta:
      type: object
      required: [total, page, page_size]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }

    # ───────────── me ─────────────
    CurrentUser:
      type: object
      required: [id, role, email, display_name, onboarding, company]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        email:
          type: string
          format: email
          examples: [candidate@demo.scout]
        display_name:
          type: string
          examples: [Алексей Смирнов]
        onboarding:
          description: Только для кандидата
          oneOf:
            - $ref: '#/components/schemas/OnboardingState'
            - type: 'null'
        company:
          description: Только для работодателя
          oneOf:
            - $ref: '#/components/schemas/CompanyBrief'
            - type: 'null'

    OnboardingState:
      type: object
      required: [consents_given, survey_completed, grade_confirmed, next_step, active_test_id]
      properties:
        consents_given:
          type: boolean
          description: Даны обязательные согласия (personal_data)
        survey_completed: { type: boolean }
        grade_confirmed: { type: boolean }
        next_step: { $ref: '#/components/schemas/OnboardingStep' }
        active_test_id:
          type: [string, 'null']
          format: uuid

    AccountDeletion:
      type: object
      required: [scheduled_at]
      properties:
        scheduled_at:
          type: string
          format: date-time

    ConsentDocument:
      type: object
      required: [type, version, title, summary, required, document_url]
      properties:
        type: { $ref: '#/components/schemas/ConsentType' }
        version:
          type: string
          examples: ['2026-09']
        title:
          type: string
          examples: [Согласие на обработку персональных данных]
        summary:
          type: string
        required:
          type: boolean
          description: Без него нельзя пользоваться платформой
        document_url:
          type: string
          format: uri-reference

    Consent:
      type: object
      required: [type, version, given_at, revoked_at]
      properties:
        type: { $ref: '#/components/schemas/ConsentType' }
        version: { type: string }
        given_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time

    ConsentState:
      type: object
      required: [documents, consents]
      properties:
        documents:
          type: array
          items: { $ref: '#/components/schemas/ConsentDocument' }
        consents:
          type: array
          description: Последняя запись по каждому типу
          items: { $ref: '#/components/schemas/Consent' }

    ConsentsUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            required: [type, version, given]
            properties:
              type: { $ref: '#/components/schemas/ConsentType' }
              version: { type: string }
              given: { type: boolean }

    # ───────────── taxonomy ─────────────
    Taxonomy:
      type: object
      required: [specializations, grades, industries, skills, cities]
      properties:
        specializations:
          type: array
          items:
            type: object
            required: [id, name, competencies]
            properties:
              id: { $ref: '#/components/schemas/Specialization' }
              name:
                type: string
                examples: [Backend]
              competencies:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: string, examples: [backend.databases] }
                    name: { type: string, examples: [Базы данных] }
        grades:
          type: array
          items:
            type: object
            required: [id, name, experience]
            properties:
              id: { $ref: '#/components/schemas/Grade' }
              name: { type: string, examples: [Middle] }
              experience: { type: string, examples: [1–3 года] }
        industries:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { $ref: '#/components/schemas/Industry' }
              name: { type: string, examples: [Финтех] }
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        cities:
          type: array
          items: { type: string }
          examples: [[Москва, Санкт-Петербург, Казань]]

    Skill:
      type: object
      required: [id, name, specializations, competency_id, aliases]
      properties:
        id: { type: string, examples: [kubernetes] }
        name: { type: string, examples: [Kubernetes] }
        specializations:
          type: array
          items: { $ref: '#/components/schemas/Specialization' }
        competency_id: { type: string, examples: [devops.orchestration] }
        aliases:
          type: array
          items: { type: string }
          examples: [[k8s, кубер, кубернетес]]

    # ───────────── profile ─────────────
    CandidateSkill:
      type: object
      required: [skill_id, name, level, source, verified, score]
      properties:
        skill_id: { type: string, examples: [postgresql] }
        name: { type: string, examples: [PostgreSQL] }
        level: { $ref: '#/components/schemas/SkillLevel' }
        source: { $ref: '#/components/schemas/SkillSource' }
        verified:
          type: boolean
          description: Подтверждён тестом, заданием или ФСП
        score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Балл по навыку в тесте, если подтверждён тестом

    CandidateSkillInput:
      type: object
      required: [skill_id, level, source]
      properties:
        skill_id: { type: string }
        level: { $ref: '#/components/schemas/SkillLevel' }
        source:
          type: string
          enum: [self, resume]

    ExperienceItem:
      type: object
      required: [role, company_name, company_hidden, industry, start, end, description]
      properties:
        role:
          type: string
          examples: [Backend-разработчик]
        company_name:
          type: [string, 'null']
          description: '`null`, если кандидат скрыл названия компаний'
          examples: [ООО «Платёжные решения»]
        company_hidden: { type: boolean }
        industry:
          oneOf:
            - $ref: '#/components/schemas/Industry'
            - type: 'null'
        start:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Месяц начала YYYY-MM
          examples: ['2023-02']
        end:
          type: [string, 'null']
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Месяц окончания, `null` — по настоящее время
        description:
          type: [string, 'null']
          maxLength: 1000

    ExperienceInput:
      type: object
      required: [role, start]
      properties:
        role: { type: string, minLength: 2, maxLength: 120 }
        company_name: { type: [string, 'null'], maxLength: 120 }
        industry:
          oneOf:
            - $ref: '#/components/schemas/Industry'
            - type: 'null'
        start:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        end:
          type: [string, 'null']
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        description: { type: [string, 'null'], maxLength: 1000 }

    CategoryStanding:
      type: object
      description: Подтверждённое место кандидата в категории
      required: [category, percentile, confirmed_at, test_id]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        percentile:
          type: integer
          minimum: 1
          maximum: 99
          examples: [82]
        confirmed_at:
          type: string
          format: date-time
        test_id: { type: string, format: uuid }
        flags:
          type: array
          items: { $ref: '#/components/schemas/IntegrityFlag' }

    IntegrityFlag:
      type: object
      description: Сигнал прокторинга подтверждающего теста; не доказывает нарушение
      required: [code, severity]
      properties:
        code:
          type: string
          enum: [fast_correct, paste, focus_loss]
        severity:
          type: string
          enum: [info, warning]

    CandidateProfile:
      type: object
      required:
        - id
        - full_name
        - email
        - phone
        - telegram
        - city
        - relocation
        - about
        - specialization
        - standing
        - experience_years
        - experience
        - skills
        - industries
        - work_formats
        - salary_expectation
        - availability
        - completeness
        - visibility
        - updated_at
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string, examples: [Алексей Смирнов] }
        email: { type: string, format: email }
        phone: { type: [string, 'null'], examples: ['+7 915 123-45-67'] }
        telegram: { type: [string, 'null'], examples: ['@a_smirnov'] }
        city: { type: [string, 'null'], examples: [Казань] }
        relocation: { type: boolean }
        about: { type: [string, 'null'], maxLength: 2000 }
        specialization:
          oneOf:
            - $ref: '#/components/schemas/Specialization'
            - type: 'null'
        standing:
          description: '`null` — грейд не подтверждён'
          oneOf:
            - $ref: '#/components/schemas/CategoryStanding'
            - type: 'null'
        experience_years:
          type: number
          minimum: 0
          maximum: 50
          examples: [3.5]
        experience:
          type: array
          items: { $ref: '#/components/schemas/ExperienceItem' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/CandidateSkill' }
        industries:
          type: array
          items: { $ref: '#/components/schemas/Industry' }
        work_formats:
          type: array
          items: { $ref: '#/components/schemas/WorkFormat' }
        salary_expectation:
          oneOf:
            - $ref: '#/components/schemas/SalaryRange'
            - type: 'null'
        availability: { $ref: '#/components/schemas/Availability' }
        completeness:
          type: integer
          minimum: 0
          maximum: 100
          description: Полнота профиля, %
        visibility: { $ref: '#/components/schemas/ProfileVisibility' }
        updated_at: { type: string, format: date-time }

    CandidateProfileUpdate:
      type: object
      required: [full_name, relocation, experience_years, experience, skills, industries, work_formats, salary_expectation]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 120 }
        phone:
          type: [string, 'null']
          pattern: '^\+?[0-9 ()-]{10,20}$'
        telegram:
          type: [string, 'null']
          pattern: '^@[A-Za-z0-9_]{4,32}$'
        city: { type: [string, 'null'], maxLength: 100 }
        relocation: { type: boolean }
        about: { type: [string, 'null'], maxLength: 2000 }
        experience_years: { type: number, minimum: 0, maximum: 50 }
        experience:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ExperienceInput' }
        skills:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CandidateSkillInput' }
        industries:
          type: array
          items: { $ref: '#/components/schemas/Industry' }
        work_formats:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorkFormat' }
        salary_expectation: { $ref: '#/components/schemas/SalaryRange' }

    ResumeParseResult:
      type: object
      required: [resume_id, file_name, uploaded_at, fields, confidence, warnings]
      properties:
        resume_id: { type: string, format: uuid }
        file_name: { type: string, examples: [Смирнов_CV.pdf] }
        uploaded_at: { type: string, format: date-time }
        fields: { $ref: '#/components/schemas/ParsedResumeFields' }
        confidence:
          type: object
          description: Уверенность распознавания по полям (ключ — имя поля из `fields`), 0–1
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
          examples:
            - { full_name: 0.98, email: 0.99, skills: 0.81, experience_years: 0.64 }
        warnings:
          type: array
          items: { type: string }
          examples: [['Стаж посчитан по датам, проверьте']]

    ParsedResumeFields:
      type: object
      required: [full_name, email, phone, telegram, city, experience_years, roles, skills, soft_skills, experience, about]
      properties:
        full_name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        telegram: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        experience_years: { type: [number, 'null'] }
        roles:
          type: array
          items: { type: string }
        skills:
          type: array
          items:
            type: object
            required: [raw, skill_id, name]
            properties:
              raw:
                type: string
                description: Как написано в резюме
                examples: [постгрес]
              skill_id:
                type: [string, 'null']
                description: Нормализованный навык из справочника (через синонимы), `null` — не распознан
                examples: [postgresql]
              name: { type: string, examples: [PostgreSQL] }
        soft_skills:
          type: array
          items: { type: string }
        experience:
          type: array
          items: { $ref: '#/components/schemas/ExperienceItem' }
        about: { type: [string, 'null'] }

    PrivacySettings:
      type: object
      required: [availability, salary_floor, hidden_companies, show_fsp, show_company_names, show_city, profile_published]
      properties:
        availability: { $ref: '#/components/schemas/Availability' }
        salary_floor:
          type: [integer, 'null']
          minimum: 10000
          description: Скрытый минимум (₽/мес на руки). Работодатель его не видит.
          examples: [240000]
        hidden_companies:
          type: array
          items: { $ref: '#/components/schemas/CompanyBrief' }
        show_fsp:
          type: boolean
          description: Показывать работодателям достижения ФСП
        show_company_names:
          type: boolean
          description: Показывать названия компаний в опыте
        show_city: { type: boolean }
        profile_published:
          type: boolean
          readOnly: true
          description: Профиль в выдаче (есть согласие profile_visibility, грейд подтверждён и статус не «не ищу»)

    PrivacySettingsUpdate:
      type: object
      required: [availability, salary_floor, hidden_company_ids, show_fsp, show_company_names, show_city]
      properties:
        availability: { $ref: '#/components/schemas/Availability' }
        salary_floor:
          type: [integer, 'null']
          minimum: 10000
          maximum: 10000000
        hidden_company_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        show_fsp: { type: boolean }
        show_company_names: { type: boolean }
        show_city: { type: boolean }

    # ───────────── assessment ─────────────
    SurveyCreate:
      type: object
      required: [industries, specialization, primary_stack, experience_years, work_formats, city, relocation, salary_expectation]
      properties:
        industries:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/Industry' }
        specialization: { $ref: '#/components/schemas/Specialization' }
        primary_stack:
          type: array
          minItems: 1
          maxItems: 15
          description: ID навыков из справочника
          items: { type: string }
          examples: [[python, go, postgresql, kafka]]
        experience_years:
          type: number
          minimum: 0
          maximum: 50
        work_formats:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorkFormat' }
        city: { type: [string, 'null'], maxLength: 100 }
        relocation: { type: boolean }
        salary_expectation: { $ref: '#/components/schemas/SalaryRange' }

    Survey:
      allOf:
        - $ref: '#/components/schemas/SurveyCreate'
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }

    TestEligibility:
      type: object
      required: [specialization, current_grade, last_grade_change_at, next_grade_change_at, active_test_id, grades]
      properties:
        specialization:
          oneOf:
            - $ref: '#/components/schemas/Specialization'
            - type: 'null'
        current_grade:
          oneOf:
            - $ref: '#/components/schemas/Grade'
            - type: 'null'
        last_grade_change_at: { type: [string, 'null'], format: date-time }
        next_grade_change_at:
          type: [string, 'null']
          format: date-time
          description: Когда подтверждённый грейд снова можно сменить (90 дней)
        active_test_id: { type: [string, 'null'], format: uuid }
        grades:
          type: array
          items: { $ref: '#/components/schemas/GradeEligibility' }

    GradeEligibility:
      type: object
      required: [grade, can_start, reason, available_at, recommended]
      properties:
        grade: { $ref: '#/components/schemas/Grade' }
        can_start: { type: boolean }
        reason:
          oneOf:
            - $ref: '#/components/schemas/EligibilityReason'
            - type: 'null'
        available_at:
          type: [string, 'null']
          format: date-time
          description: Когда станет доступно (если `can_start = false` из-за срока)
        recommended:
          type: boolean
          description: Рекомендуем по стажу из опроса

    TestCreate:
      type: object
      required: [declared_grade]
      properties:
        declared_grade: { $ref: '#/components/schemas/Grade' }
        specialization:
          $ref: '#/components/schemas/Specialization'
          description: По умолчанию из последнего опроса
        vacancy_id:
          type: [string, 'null']
          format: uuid
          description: Построить бланк теста под вакансию

    TestProgress:
      type: object
      required: [block, answered, adaptive_answered, adaptive_min, adaptive_max, practice_answered, practice_total]
      properties:
        block: { $ref: '#/components/schemas/TestBlock' }
        answered:
          type: integer
          minimum: 0
          description: Всего ответов
        adaptive_answered: { type: integer, minimum: 0 }
        adaptive_min:
          type: integer
          examples: [10]
        adaptive_max:
          type: integer
          examples: [18]
        practice_answered: { type: integer, minimum: 0 }
        practice_total:
          type: integer
          minimum: 0
          description: 0 — практический блок выключен

    TestSession:
      type: object
      required: [id, specialization, declared_grade, status, started_at, deadline_at, finished_at, time_limit_sec, progress, vacancy_id]
      properties:
        express: { type: boolean }
        id: { type: string, format: uuid }
        specialization: { $ref: '#/components/schemas/Specialization' }
        declared_grade: { $ref: '#/components/schemas/Grade' }
        status: { $ref: '#/components/schemas/TestStatus' }
        started_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        time_limit_sec:
          type: integer
          examples: [2400]
        progress: { $ref: '#/components/schemas/TestProgress' }
        vacancy_id: { type: [string, 'null'], format: uuid }

    TestSessionSummary:
      type: object
      required: [id, specialization, declared_grade, status, outcome, assigned_grade, percentile, started_at, finished_at]
      properties:
        express: { type: boolean }
        id: { type: string, format: uuid }
        specialization: { $ref: '#/components/schemas/Specialization' }
        declared_grade: { $ref: '#/components/schemas/Grade' }
        status: { $ref: '#/components/schemas/TestStatus' }
        outcome:
          oneOf:
            - $ref: '#/components/schemas/TestOutcome'
            - type: 'null'
        assigned_grade:
          oneOf:
            - $ref: '#/components/schemas/Grade'
            - type: 'null'
        percentile: { type: [integer, 'null'], minimum: 1, maximum: 99 }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    CodeSnippet:
      type: object
      required: [language, source]
      properties:
        language: { $ref: '#/components/schemas/CodeLanguage' }
        source: { type: string }

    TestItem:
      type: object
      description: Экземпляр задания. Семейство, параметры и правильный ответ не раскрываются.
      required: [instance_id, index, block, type, competency, difficulty_level, title, prompt, code, options, answer_language, starter_code, max_length, public_tests]
      properties:
        instance_id: { type: string, format: uuid }
        index:
          type: integer
          minimum: 1
          description: Порядковый номер в сессии
        block: { $ref: '#/components/schemas/TestBlock' }
        type: { $ref: '#/components/schemas/ItemType' }
        competency:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string, examples: [Базы данных] }
        difficulty_level:
          type: integer
          minimum: 1
          maximum: 5
          description: Сложность задания (квантиль параметра b), показывается кандидату
        title: { type: string, examples: ['Что выведет программа?'] }
        prompt:
          type: string
          description: Текст задания (простая разметка — абзацы через пустую строку, `код` в обратных кавычках)
        code:
          description: Фрагмент кода для чтения
          oneOf:
            - $ref: '#/components/schemas/CodeSnippet'
            - type: 'null'
        options:
          description: Для single_choice и multiple_choice
          oneOf:
            - type: array
              items:
                type: object
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
            - type: 'null'
        answer_language:
          description: Язык ответа для type=code
          oneOf:
            - $ref: '#/components/schemas/CodeLanguage'
            - type: 'null'
        starter_code: { type: [string, 'null'] }
        max_length:
          type: [integer, 'null']
          description: Лимит символов для short_answer и open_text
        public_tests:
          description: Открытые тесты практического задания
          oneOf:
            - type: array
              items:
                type: object
                required: [name, input, expected]
                properties:
                  name: { type: string }
                  input: { type: string }
                  expected: { type: string }
            - type: 'null'

    TestStep:
      type: object
      required: [status, item, progress, deadline_at]
      properties:
        status:
          type: string
          enum: [item, ready_to_finish]
        item:
          oneOf:
            - $ref: '#/components/schemas/TestItem'
            - type: 'null'
        progress: { $ref: '#/components/schemas/TestProgress' }
        deadline_at: { type: string, format: date-time }

    Answer:
      type: object
      description: 'single_choice/multiple_choice — option_ids; short_answer/open_text — text; code — code + language; skipped — пропуск'
      properties:
        option_ids:
          type: array
          items: { type: string }
        text: { type: string, maxLength: 4000 }
        code: { type: string, maxLength: 20000 }
        language: { $ref: '#/components/schemas/CodeLanguage' }
        skipped: { type: boolean }

    AnswerSubmit:
      type: object
      required: [instance_id, answer, rt_ms, paste_count, focus_lost_count]
      properties:
        instance_id: { type: string, format: uuid }
        answer: { $ref: '#/components/schemas/Answer' }
        rt_ms:
          type: integer
          minimum: 0
          description: Время ответа, мс
        paste_count:
          type: integer
          minimum: 0
          description: Вставок из буфера на этом задании
        focus_lost_count:
          type: integer
          minimum: 0
          description: Потерь фокуса вкладки на этом задании

    AnswerAck:
      type: object
      required: [accepted, progress]
      properties:
        accepted: { type: boolean }
        progress: { $ref: '#/components/schemas/TestProgress' }

    CodeRunRequest:
      type: object
      required: [instance_id, code, language]
      properties:
        instance_id: { type: string, format: uuid }
        code: { type: string, maxLength: 20000 }
        language: { $ref: '#/components/schemas/CodeLanguage' }

    CodeRunResult:
      type: object
      required: [status, passed, total, cases, duration_ms]
      properties:
        status:
          type: string
          enum: [ok, compile_error, runtime_error, timeout]
        passed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
        cases:
          type: array
          items:
            type: object
            required: [name, passed, actual, stderr]
            properties:
              name: { type: string }
              passed: { type: boolean }
              actual: { type: [string, 'null'] }
              stderr: { type: [string, 'null'] }

    TestResult:
      type: object
      required:
        - test_id
        - specialization
        - declared_grade
        - outcome
        - assigned_grade
        - category
        - percentile
        - theta
        - se
        - confidence
        - confirmed_skills
        - competencies
        - suggestion
        - flags
        - items_answered
        - duration_sec
        - finished_at
        - next_retake_at
        - next_grade_change_at
        - trace
      properties:
        express: { type: boolean }
        test_id: { type: string, format: uuid }
        specialization: { $ref: '#/components/schemas/Specialization' }
        declared_grade: { $ref: '#/components/schemas/Grade' }
        outcome: { $ref: '#/components/schemas/TestOutcome' }
        assigned_grade:
          description: Подтверждённый грейд по итогам. При провале — прежний подтверждённый (не понижается принудительно) или `null`
          oneOf:
            - $ref: '#/components/schemas/Grade'
            - type: 'null'
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        percentile:
          type: [integer, 'null']
          minimum: 1
          maximum: 99
          description: Перцентиль θ внутри категории
        theta:
          type: number
          description: Оценка способности θ (EAP)
          examples: [0.84]
        se:
          type: number
          description: Стандартная ошибка θ
          examples: [0.31]
        confidence:
          type: string
          enum: [high, medium, low]
          description: Уверенность с учётом SE и флагов
        confirmed_skills:
          type: array
          items: { $ref: '#/components/schemas/CandidateSkill' }
        competencies:
          type: array
          items:
            type: object
            required: [competency_id, name, score, items]
            properties:
              competency_id: { type: string }
              name: { type: string }
              score: { type: integer, minimum: 0, maximum: 100 }
              items: { type: integer, minimum: 0 }
        suggestion: { $ref: '#/components/schemas/TestSuggestion' }
        flags:
          type: array
          items:
            type: object
            required: [code, severity, message]
            properties:
              code:
                type: string
                enum: [fast_correct, paste, focus_loss]
              severity:
                type: string
                enum: [info, warning]
              message: { type: string }
        items_answered: { type: integer }
        duration_sec: { type: integer }
        finished_at: { type: string, format: date-time }
        next_retake_at:
          type: [string, 'null']
          format: date-time
          description: Повтор на тот же грейд (через 30 дней)
        next_grade_change_at:
          type: [string, 'null']
          format: date-time
          description: Следующая смена подтверждённого грейда (через 90 дней)
        trace:
          type: array
          description: Траектория CAT по заданиям (для графика «как менялась сложность»)
          items:
            type: object
            required: [index, difficulty_level, correct, theta, se]
            properties:
              index: { type: integer }
              difficulty_level: { type: integer, minimum: 1, maximum: 5 }
              correct: { type: boolean }
              theta: { type: number }
              se: { type: number }

    TestSuggestion:
      type: object
      required: [action, grade, available_at, message]
      properties:
        action:
          type: string
          enum: [try_higher, try_lower, none]
        grade:
          oneOf:
            - $ref: '#/components/schemas/Grade'
            - type: 'null'
        available_at:
          type: [string, 'null']
          format: date-time
          description: '`null` — доступно сразу'
        message:
          type: string
          examples: [Вы уверенно прошли Middle. Можно попробовать тест на Senior.]

    GradeHistoryEntry:
      type: object
      required: [id, specialization, grade, previous_grade, changed_at, test_id, reason]
      properties:
        id: { type: string, format: uuid }
        specialization: { $ref: '#/components/schemas/Specialization' }
        grade: { $ref: '#/components/schemas/Grade' }
        previous_grade:
          oneOf:
            - $ref: '#/components/schemas/Grade'
            - type: 'null'
        changed_at: { type: string, format: date-time }
        test_id: { type: [string, 'null'], format: uuid }
        reason:
          type: string
          enum: [test_passed, test_lower, admin]

    ItemFamilyBrief:
      type: object
      required: [id, title, specialization, competency, type, a, b]
      properties:
        id: { type: string, examples: [sql-window-top-n] }
        title: { type: string, examples: [Топ-N в группе на оконных функциях] }
        specialization: { $ref: '#/components/schemas/Specialization' }
        competency: { type: string, examples: [Базы данных] }
        type: { $ref: '#/components/schemas/ItemType' }
        a:
          type: number
          description: Дискриминативность (2PL)
          examples: [1.42]
        b:
          type: number
          description: Сложность (2PL)
          examples: [0.35]

    ItemFamily:
      allOf:
        - $ref: '#/components/schemas/ItemFamilyBrief'
        - type: object
          required: [description, template, params, instances, exposure_rate, calibration_n]
          properties:
            description: { type: string }
            template:
              type: string
              description: Шаблон с плейсхолдерами `{{param}}`
            params:
              type: array
              items:
                type: object
                required: [name, description, domain]
                properties:
                  name: { type: string, examples: [n] }
                  description: { type: string, examples: [Сколько строк взять в группе] }
                  domain: { type: string, examples: ['2..5'] }
            instances:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/ItemInstancePreview' }
            exposure_rate:
              type: number
              minimum: 0
              maximum: 1
              description: Доля сессий, где встречалось семейство (цель ≤ 0.2)
            calibration_n:
              type: integer
              description: Размер выборки калибровки

    ItemInstancePreview:
      type: object
      required: [seed, params, title, prompt, code, options, correct_answer]
      properties:
        seed: { type: integer }
        params:
          type: object
          additionalProperties: true
        title: { type: string }
        prompt: { type: string }
        code:
          oneOf:
            - $ref: '#/components/schemas/CodeSnippet'
            - type: 'null'
        options:
          oneOf:
            - type: array
              items:
                type: object
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
            - type: 'null'
        correct_answer:
          type: string
          description: Только для витрины — вычислен из параметров

    TestBlueprint:
      type: object
      required: [vacancy_id, vacancy_title, specialization, grade, extracted_skills, competencies, adaptive_items, practice, generated_at]
      properties:
        vacancy_id: { type: string, format: uuid }
        vacancy_title: { type: string }
        specialization: { $ref: '#/components/schemas/Specialization' }
        grade: { $ref: '#/components/schemas/Grade' }
        extracted_skills:
          type: array
          items:
            type: object
            required: [skill, weight, importance]
            properties:
              skill: { $ref: '#/components/schemas/SkillRef' }
              weight: { type: number, minimum: 0, maximum: 1 }
              importance:
                type: string
                enum: [must, nice]
        competencies:
          type: array
          description: Доли компетенций в бланке, сумма share = 1
          items:
            type: object
            required: [competency_id, name, share, families_count, skills]
            properties:
              competency_id: { type: string }
              name: { type: string, examples: [Go] }
              share:
                type: number
                minimum: 0
                maximum: 1
                examples: [0.4]
              families_count: { type: integer }
              skills:
                type: array
                items: { $ref: '#/components/schemas/SkillRef' }
        adaptive_items:
          type: object
          required: [min, max]
          properties:
            min: { type: integer }
            max: { type: integer }
        practice:
          oneOf:
            - type: object
              required: [title, language]
              properties:
                title: { type: string }
                language: { $ref: '#/components/schemas/CodeLanguage' }
            - type: 'null'
        generated_at: { type: string, format: date-time }

    # ───────────── fsp ─────────────
    FspAchievement:
      type: object
      required: [id, event_id, title, date, level, discipline, format, team, role, place, participants_total, percentile, result, sport_rank, certificate_url, verified]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, examples: [fsp-2025-prod-final] }
        title: { type: string, examples: [Чемпионат России по продуктовому программированию 2025] }
        date: { type: string, format: date }
        level: { $ref: '#/components/schemas/FspLevel' }
        discipline: { $ref: '#/components/schemas/FspDiscipline' }
        format: { $ref: '#/components/schemas/FspFormat' }
        team: { type: [string, 'null'], examples: [404 Not Found] }
        role: { type: [string, 'null'], examples: [Backend] }
        place: { type: [integer, 'null'], minimum: 1 }
        participants_total: { type: [integer, 'null'], minimum: 1 }
        percentile:
          type: [integer, 'null']
          minimum: 1
          maximum: 99
        result: { $ref: '#/components/schemas/FspResult' }
        sport_rank:
          type: [string, 'null']
          description: Спортивный разряд
          examples: [КМС]
        certificate_url: { type: [string, 'null'], format: uri }
        verified:
          type: boolean
          description: Подпись реестра ФСП проверена

    FspIndexComponent:
      type: object
      required: [achievement_id, title, level_weight, result_weight, relevance, decay, contribution]
      properties:
        achievement_id: { type: string, format: uuid }
        title: { type: string }
        level_weight: { type: number }
        result_weight: { type: number }
        relevance:
          type: number
          minimum: 0
          maximum: 1
          description: Релевантность дисциплины специализации
        decay:
          type: number
          minimum: 0
          maximum: 1
          description: Затухание (период полураспада 2 года)
        contribution:
          type: number
          description: Вклад в индекс, баллы

    FspProfile:
      type: object
      required: [linked, fsp_id, verified_at, has_history, index, bonus, components, achievements]
      properties:
        linked: { type: boolean }
        fsp_id: { type: [string, 'null'], examples: [FSP-77-004215] }
        verified_at: { type: [string, 'null'], format: date-time }
        has_history:
          type: boolean
          description: '`false` — нейтральное состояние «Нет истории ФСП» (бонус 0, без штрафа)'
        index:
          type: integer
          minimum: 0
          maximum: 100
          description: ФСП-индекс
        bonus:
          type: number
          minimum: 0
          maximum: 30
          description: Бонус к силе профиля
        components:
          type: array
          items: { $ref: '#/components/schemas/FspIndexComponent' }
        achievements:
          type: array
          items: { $ref: '#/components/schemas/FspAchievement' }

    FspSummary:
      type: object
      required: [has_history, index, bonus, achievements_count, top_achievement, max_level]
      properties:
        has_history: { type: boolean }
        index: { type: integer, minimum: 0, maximum: 100 }
        bonus: { type: number, minimum: 0, maximum: 30 }
        achievements_count: { type: integer, minimum: 0 }
        top_achievement:
          oneOf:
            - $ref: '#/components/schemas/FspAchievement'
            - type: 'null'
        max_level:
          oneOf:
            - $ref: '#/components/schemas/FspLevel'
            - type: 'null'

    FspLinkRequest:
      type: object
      required: [fsp_id]
      properties:
        fsp_id:
          type: string
          pattern: '^FSP-\d{2}-\d{6}$'
          examples: [FSP-77-004215]

    FspWebhookEvent:
      type: object
      required: [event, fsp_id, occurred_at, achievement]
      properties:
        event:
          type: string
          enum: [achievement.created]
        fsp_id: { type: string }
        occurred_at: { type: string, format: date-time }
        achievement: { $ref: '#/components/schemas/FspAchievement' }

    # ───────────── company ─────────────
    Company:
      type: object
      required: [id, name, industry, description, website, city, size, inn, contact_email, contact_phone, verified, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Северный код] }
        industry: { $ref: '#/components/schemas/Industry' }
        description: { type: string, maxLength: 3000 }
        website: { type: [string, 'null'], format: uri }
        city: { type: [string, 'null'] }
        size:
          type: string
          enum: ['1-50', '51-200', '201-1000', '1000+']
        inn:
          type: [string, 'null']
          pattern: '^(\d{10}|\d{12})$'
          description: Необязателен в MVP
        contact_email: { type: string, format: email }
        contact_phone: { type: [string, 'null'] }
        verified: { type: boolean }
        created_at: { type: string, format: date-time }

    CompanyUpdate:
      type: object
      required: [name, industry, description, city, size, contact_email]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        industry: { $ref: '#/components/schemas/Industry' }
        description: { type: string, minLength: 20, maxLength: 3000 }
        website: { type: [string, 'null'], format: uri }
        city: { type: [string, 'null'] }
        size:
          type: string
          enum: ['1-50', '51-200', '201-1000', '1000+']
        inn:
          type: [string, 'null']
          pattern: '^(\d{10}|\d{12})$'
        contact_email: { type: string, format: email }
        contact_phone: { type: [string, 'null'] }

    # ───────────── needs ─────────────
    NeedCreate:
      type: object
      required: [raw_text]
      properties:
        raw_text:
          type: string
          minLength: 20
          maxLength: 4000

    ParsedNeed:
      type: object
      required: [specialization, grade, must_skills, nice_skills, work_formats, city, industry, salary, unrecognized]
      properties:
        specialization:
          oneOf:
            - $ref: '#/components/schemas/Specialization'
            - type: 'null'
        grade:
          oneOf:
            - $ref: '#/components/schemas/Grade'
            - type: 'null'
        must_skills:
          type: array
          items: { $ref: '#/components/schemas/SkillRef' }
        nice_skills:
          type: array
          items: { $ref: '#/components/schemas/SkillRef' }
        work_formats:
          type: array
          items: { $ref: '#/components/schemas/WorkFormat' }
        city: { type: [string, 'null'] }
        industry:
          oneOf:
            - $ref: '#/components/schemas/Industry'
            - type: 'null'
        salary:
          description: Вилка, если найдена в тексте. Всё равно требует подтверждения
          oneOf:
            - $ref: '#/components/schemas/SalaryRange'
            - type: 'null'
        unrecognized:
          type: array
          description: Термины, которые не удалось сопоставить со справочником
          items: { type: string }

    NeedConfirm:
      type: object
      required: [specialization, grade, must_skills, nice_skills, work_formats, city, industry, salary]
      properties:
        specialization: { $ref: '#/components/schemas/Specialization' }
        grade: { $ref: '#/components/schemas/Grade' }
        must_skills:
          type: array
          maxItems: 15
          items: { type: string }
        nice_skills:
          type: array
          maxItems: 15
          items: { type: string }
        work_formats:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorkFormat' }
        city: { type: [string, 'null'] }
        industry:
          oneOf:
            - $ref: '#/components/schemas/Industry'
            - type: 'null'
        salary: { $ref: '#/components/schemas/SalaryRange' }

    ConfirmedNeed:
      type: object
      required: [specialization, grade, must_skills, nice_skills, work_formats, city, industry, salary]
      properties:
        specialization: { $ref: '#/components/schemas/Specialization' }
        grade: { $ref: '#/components/schemas/Grade' }
        must_skills:
          type: array
          items: { $ref: '#/components/schemas/SkillRef' }
        nice_skills:
          type: array
          items: { $ref: '#/components/schemas/SkillRef' }
        work_formats:
          type: array
          items: { $ref: '#/components/schemas/WorkFormat' }
        city: { type: [string, 'null'] }
        industry:
          oneOf:
            - $ref: '#/components/schemas/Industry'
            - type: 'null'
        salary: { $ref: '#/components/schemas/SalaryRange' }

    Need:
      type: object
      required: [id, raw_text, parsed, confirmed, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        raw_text: { type: string }
        parsed: { $ref: '#/components/schemas/ParsedNeed' }
        confirmed:
          description: '`null` — черновик, ещё не подтверждён'
          oneOf:
            - $ref: '#/components/schemas/ConfirmedNeed'
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SalaryRadar:
      type: object
      description: Распределение ожиданий кандидатов категории относительно вилки
      required: [category, salary, candidates_total, share_above, share_within, share_below, median, p25, p75, histogram, verdict, message]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        salary: { $ref: '#/components/schemas/SalaryRange' }
        candidates_total: { type: integer, minimum: 0 }
        share_above:
          type: number
          minimum: 0
          maximum: 1
          description: Доля кандидатов, чьи ожидания (нижняя граница) выше верха вилки
          examples: [0.6]
        share_within:
          type: number
          minimum: 0
          maximum: 1
          description: Доля кандидатов, чьи ожидания пересекаются с вилкой
        share_below:
          type: number
          minimum: 0
          maximum: 1
          description: Доля кандидатов, чьи ожидания (верхняя граница) ниже низа вилки
        median: { type: [integer, 'null'] }
        p25: { type: [integer, 'null'] }
        p75: { type: [integer, 'null'] }
        histogram:
          type: array
          items:
            type: object
            required: [from, to, count]
            properties:
              from: { type: integer }
              to: { type: integer }
              count: { type: integer, minimum: 0 }
        verdict:
          type: string
          enum: [below_market, in_market, above_market]
        message:
          type: string
          examples: [Ваша вилка ниже ожиданий 60% кандидатов Backend · Middle]

    CategoryRecommendation:
      type: object
      required: [category, kind, candidate_count, median_expectation, reason, radar]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        kind:
          type: string
          enum: [primary, adjacent]
          description: Основная или соседняя категория
        candidate_count: { type: integer, minimum: 0 }
        median_expectation: { type: [integer, 'null'] }
        reason:
          type: string
          examples: [Middle Python с подтверждённым Go]
        radar: { $ref: '#/components/schemas/SalaryRadar' }

    NeedCategories:
      type: object
      required: [need_id, salary, items]
      properties:
        need_id: { type: string, format: uuid }
        salary: { $ref: '#/components/schemas/SalaryRange' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CategoryRecommendation' }

    # ───────────── searches ─────────────
    SearchFilters:
      type: object
      required: [specialization, grades, must_skills, nice_skills, work_formats, city, include_relocation, industries, salary, fsp_only, fsp_level_min, availability]
      properties:
        specialization: { $ref: '#/components/schemas/Specialization' }
        grades:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Grade' }
        must_skills:
          type: array
          maxItems: 15
          items: { type: string }
        nice_skills:
          type: array
          maxItems: 15
          items: { type: string }
        work_formats:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorkFormat' }
        city: { type: [string, 'null'] }
        include_relocation:
          type: boolean
          description: Учитывать готовых к переезду из других городов
        industries:
          type: array
          items: { $ref: '#/components/schemas/Industry' }
        salary: { $ref: '#/components/schemas/SalaryRange' }
        fsp_only: { type: boolean }
        fsp_level_min:
          oneOf:
            - $ref: '#/components/schemas/FspLevel'
            - type: 'null'
        availability:
          type: array
          minItems: 1
          items:
            type: string
            enum: [active, open]

    SearchVersion:
      type: object
      required: [version, created_at, label, filters, results_total]
      properties:
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        label:
          type: string
          description: Что изменилось относительно предыдущей версии
          examples: [+ Kafka обязательно]
        filters: { $ref: '#/components/schemas/SearchFilters' }
        results_total: { type: integer, minimum: 0 }

    ShortlistEntry:
      type: object
      required: [candidate_id, alias, category, added_at, added_in_version]
      properties:
        candidate_id: { type: string, format: uuid }
        alias: { type: string, examples: ['Кандидат #7F3A'] }
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        added_at: { type: string, format: date-time }
        added_in_version: { type: integer, minimum: 1 }

    Search:
      type: object
      required: [id, need_id, title, created_at, updated_at, current_version, versions, shortlist]
      properties:
        id: { type: string, format: uuid }
        need_id: { type: [string, 'null'], format: uuid }
        title: { type: string, examples: [Go-разработчик в платёжный сервис] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        current_version: { type: integer, minimum: 1 }
        versions:
          type: array
          items: { $ref: '#/components/schemas/SearchVersion' }
        shortlist:
          type: array
          description: Закреплён за подборкой, не теряется при смене версии
          items: { $ref: '#/components/schemas/ShortlistEntry' }

    SearchCreate:
      type: object
      required: [filters]
      properties:
        need_id: { type: [string, 'null'], format: uuid }
        title: { type: string, maxLength: 120 }
        filters: { $ref: '#/components/schemas/SearchFilters' }

    SearchRefine:
      type: object
      required: [filters]
      properties:
        filters: { $ref: '#/components/schemas/SearchFilters' }
        label:
          type: string
          maxLength: 80
          description: Подпись версии, по умолчанию сервер формирует из разницы фильтров

    ExplanationFactor:
      type: object
      description: 'Вклад фактора в скоринг: `{factor, value, contribution, evidence}`'
      required: [kind, label, contribution, polarity, evidence]
      properties:
        kind: { $ref: '#/components/schemas/FactorKind' }
        label:
          type: string
          examples: ['Go, PostgreSQL подтверждены тестом']
        contribution:
          type: number
          description: Вклад в итоговый Score, пункты (со знаком)
          examples: [18.4]
        polarity: { $ref: '#/components/schemas/Polarity' }
        evidence:
          type: [string, 'null']
          examples: [88-й перцентиль в Backend · Middle]

    MatchExplanation:
      type: object
      required: [score, fit, strength, chips, factors]
      properties:
        score:
          type: number
          minimum: 0
          maximum: 100
          description: 'Score = 0.6·Fit + 0.4·Strength − штрафы'
        fit: { type: number, minimum: 0, maximum: 100 }
        strength: { type: number, minimum: 0, maximum: 130 }
        chips:
          type: array
          maxItems: 3
          description: Три главных фактора для чипов
          items: { $ref: '#/components/schemas/ExplanationFactor' }
        factors:
          type: array
          description: Полный список для панели «Почему в подборке»
          items: { $ref: '#/components/schemas/ExplanationFactor' }

    SearchResultItem:
      type: object
      required: [rank, candidate, explanation, shortlisted]
      properties:
        rank: { type: integer, minimum: 1 }
        candidate: { $ref: '#/components/schemas/CandidateCard' }
        explanation: { $ref: '#/components/schemas/MatchExplanation' }
        shortlisted: { type: boolean }

    SearchResults:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [search_id, version, items, generated_at]
          properties:
            search_id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            generated_at: { type: string, format: date-time }
            items:
              type: array
              items: { $ref: '#/components/schemas/SearchResultItem' }

    # ───────────── candidates ─────────────
    CandidateContacts:
      type: object
      required: [full_name, email, phone, telegram, preferred_channel]
      properties:
        full_name: { type: string, examples: [Алексей Смирнов] }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        telegram: { type: [string, 'null'] }
        preferred_channel: { $ref: '#/components/schemas/ContactChannel' }

    Disclosure:
      type: object
      required: [revealed, reason, revealed_at, source_id]
      properties:
        revealed: { type: boolean }
        reason:
          oneOf:
            - $ref: '#/components/schemas/DisclosureReason'
            - type: 'null'
        revealed_at: { type: [string, 'null'], format: date-time }
        source_id:
          type: [string, 'null']
          format: uuid
          description: ID инвайта или отклика

    CandidateRelation:
      type: object
      description: Отношения кандидата с компанией текущего работодателя
      required: [invitation, application]
      properties:
        invitation:
          oneOf:
            - type: object
              required: [id, status]
              properties:
                id: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/InvitationStatus' }
            - type: 'null'
        application:
          oneOf:
            - type: object
              required: [id, status, vacancy_id]
              properties:
                id: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/ApplicationStatus' }
                vacancy_id: { type: string, format: uuid }
            - type: 'null'

    CandidateCard:
      type: object
      description: |
        Карточка кандидата для работодателя. До раскрытия анонимна: нет ФИО, фото, возраста, контактов,
        названия компаний скрыты по настройке. `contacts` не `null` только при `disclosure.revealed`.
      required:
        - id
        - alias
        - category
        - grade_confirmed
        - percentile
        - strength
        - skills
        - experience_years
        - experience
        - industries
        - work_formats
        - city
        - relocation
        - salary_expectation
        - availability
        - last_active_at
        - fsp
        - task_signal
        - disclosure
        - contacts
        - relation
      properties:
        id: { type: string, format: uuid }
        alias:
          type: string
          description: Анонимное имя, стабильное для пары компания–кандидат
          examples: ['Кандидат #7F3A']
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        grade_confirmed: { type: boolean }
        percentile: { type: [integer, 'null'], minimum: 1, maximum: 99 }
        test_flags:
          type: array
          items: { $ref: '#/components/schemas/IntegrityFlag' }
        strength:
          type: number
          minimum: 0
          maximum: 130
          description: Сила профиля (0–100 + бонус ФСП до 30)
        skills:
          type: array
          items: { $ref: '#/components/schemas/CandidateSkill' }
        experience_years: { type: number }
        experience:
          type: array
          items: { $ref: '#/components/schemas/ExperienceItem' }
        industries:
          type: array
          items: { $ref: '#/components/schemas/Industry' }
        work_formats:
          type: array
          items: { $ref: '#/components/schemas/WorkFormat' }
        city:
          type: [string, 'null']
          description: '`null`, если кандидат скрыл город'
        relocation: { type: boolean }
        salary_expectation:
          oneOf:
            - $ref: '#/components/schemas/SalaryRange'
            - type: 'null'
        availability: { $ref: '#/components/schemas/Availability' }
        last_active_at: { type: [string, 'null'], format: date-time }
        fsp:
          description: '`null` — кандидат скрыл данные ФСП; `has_history=false` — истории нет (нейтрально)'
          oneOf:
            - $ref: '#/components/schemas/FspSummary'
            - type: 'null'
        task_signal:
          type: object
          required: [fresh, solved_count, last_solved_at]
          properties:
            fresh:
              type: boolean
              description: Бейдж «свежий сигнал» за хорошее решение регулярного задания
            solved_count: { type: integer, minimum: 0 }
            last_solved_at: { type: [string, 'null'], format: date-time }
        disclosure: { $ref: '#/components/schemas/Disclosure' }
        contacts:
          oneOf:
            - $ref: '#/components/schemas/CandidateContacts'
            - type: 'null'
        relation: { $ref: '#/components/schemas/CandidateRelation' }

    CandidateDetail:
      allOf:
        - $ref: '#/components/schemas/CandidateCard'
        - type: object
          required: [explanation, achievements]
          properties:
            explanation:
              description: Объяснение из подборки (если передан `search_id`)
              oneOf:
                - $ref: '#/components/schemas/MatchExplanation'
                - type: 'null'
            achievements:
              type: array
              description: Достижения ФСП (пусто, если скрыты или нет)
              items: { $ref: '#/components/schemas/FspAchievement' }

    CandidatePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CandidateCard' }

    # ───────────── invitations ─────────────
    CompanyTrust:
      type: object
      description: Надёжность компании за 90 дней — защита кандидата от фиктивных вакансий
      required: [invitations_90d, acceptance_rate, withdrawn_after_accept]
      properties:
        invitations_90d: { type: integer, minimum: 0 }
        acceptance_rate: { type: number, minimum: 0, maximum: 1 }
        withdrawn_after_accept: { type: integer, minimum: 0 }

    InvitationQuota:
      type: object
      required: [limit, used, remaining, period_start, period_end, acceptance_rate, bonus]
      properties:
        limit:
          type: integer
          minimum: 0
          description: Итоговый лимит на неделю (база + бонус − штраф, не меньше 1)
          examples: [22]
        used: { type: integer, minimum: 0, examples: [7] }
        remaining: { type: integer, minimum: 0, examples: [15] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        penalty:
          type: integer
          minimum: 0
          description: Штраф за отзыв приглашений после согласия кандидата (2 за каждый)
        acceptance_rate:
          type: number
          minimum: 0
          maximum: 1
          description: Доля принятых инвайтов за 90 дней
        bonus:
          type: integer
          minimum: 0
          description: Прибавка к базовой квоте за долю принятых

    InvitationContact:
      type: object
      description: Как компания предлагает связаться
      required: [channel, value]
      properties:
        channel: { $ref: '#/components/schemas/ContactChannel' }
        value:
          type: string
          minLength: 3
          maxLength: 120
          examples: [hr@severcode.ru]

    InvitationSource:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [search, bank, task_submission, vacancy]
        id:
          type: [string, 'null']
          format: uuid

    InvitationCandidate:
      type: object
      required: [id, alias, category, percentile]
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        percentile: { type: [integer, 'null'] }

    InvitationResponse:
      type: object
      required: [decision, reason, comment, channel, call_slot, postponed_until, responded_at]
      properties:
        decision:
          type: string
          enum: [accepted, declined, postponed]
        reason:
          oneOf:
            - $ref: '#/components/schemas/DeclineReason'
            - type: 'null'
        comment: { type: [string, 'null'] }
        channel:
          description: Канал, который выбрал кандидат при принятии
          oneOf:
            - $ref: '#/components/schemas/ContactChannel'
            - type: 'null'
        call_slot:
          type: [string, 'null']
          format: date-time
          description: Удобный слот созвона (опционально)
        postponed_until: { type: [string, 'null'], format: date }
        responded_at: { type: string, format: date-time }

    InvitationEvent:
      type: object
      required: [id, at, status, actor, note]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        actor:
          type: string
          enum: [candidate, employer, system]
        note: { type: [string, 'null'] }

    Invitation:
      type: object
      required:
        - id
        - status
        - title
        - description
        - salary
        - work_format
        - city
        - company
        - contact_person
        - contact
        - vacancy
        - candidate
        - source
        - created_at
        - sent_at
        - viewed_at
        - expires_at
        - response
        - candidate_contacts
        - events
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        title:
          type: string
          examples: [Senior Go-разработчик в платёжный шлюз]
        description: { type: string }
        salary: { $ref: '#/components/schemas/SalaryRange' }
        work_format: { $ref: '#/components/schemas/WorkFormat' }
        city: { type: [string, 'null'] }
        company: { $ref: '#/components/schemas/CompanyBrief' }
        company_trust: { $ref: '#/components/schemas/CompanyTrust' }
        contact_person:
          type: string
          examples: ['Ирина Волкова, руководитель подбора']
        contact: { $ref: '#/components/schemas/InvitationContact' }
        vacancy:
          oneOf:
            - $ref: '#/components/schemas/VacancyBrief'
            - type: 'null'
        candidate: { $ref: '#/components/schemas/InvitationCandidate' }
        source: { $ref: '#/components/schemas/InvitationSource' }
        created_at: { type: string, format: date-time }
        sent_at: { type: [string, 'null'], format: date-time }
        viewed_at: { type: [string, 'null'], format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Срок ответа (по умолчанию 7 дней с отправки)
        response:
          oneOf:
            - $ref: '#/components/schemas/InvitationResponse'
            - type: 'null'
        candidate_contacts:
          description: Только для работодателя и только после принятия
          oneOf:
            - $ref: '#/components/schemas/CandidateContacts'
            - type: 'null'
        events:
          type: array
          items: { $ref: '#/components/schemas/InvitationEvent' }

    InvitationCreate:
      type: object
      required: [candidate_id, title, description, salary, work_format, city, contact_person, contact, response_days]
      properties:
        candidate_id: { type: string, format: uuid }
        title: { type: string, minLength: 5, maxLength: 120 }
        description:
          type: string
          minLength: 50
          maxLength: 3000
          description: Описание предложения
        salary: { $ref: '#/components/schemas/SalaryRange' }
        work_format: { $ref: '#/components/schemas/WorkFormat' }
        city: { type: [string, 'null'], maxLength: 100 }
        contact_person: { type: string, minLength: 2, maxLength: 120 }
        contact: { $ref: '#/components/schemas/InvitationContact' }
        response_days:
          type: integer
          minimum: 3
          maximum: 14
          default: 7
        vacancy_id: { type: [string, 'null'], format: uuid }
        source: { $ref: '#/components/schemas/InvitationSource' }

    InvitationPrecheckRequest:
      type: object
      required: [candidate_id, salary]
      properties:
        candidate_id: { type: string, format: uuid }
        salary: { $ref: '#/components/schemas/SalaryRange' }

    InvitationPrecheck:
      type: object
      required: [can_send, salary_ok, already_invited, candidate_available, quota]
      properties:
        can_send: { type: boolean }
        salary_ok:
          type: boolean
          description: '`false` — «вилка ниже ожиданий кандидата», без цифры порога'
        already_invited: { type: boolean }
        candidate_available:
          type: boolean
          description: '`false` — кандидат не ищет работу или скрыт'
        quota: { $ref: '#/components/schemas/InvitationQuota' }

    InvitationAccept:
      type: object
      required: [channel]
      properties:
        channel:
          $ref: '#/components/schemas/ContactChannel'
          description: Канал связи из своих контактов (должен быть заполнен в профиле)
        call_slot: { type: [string, 'null'], format: date-time }
        message: { type: [string, 'null'], maxLength: 1000 }

    InvitationDecline:
      type: object
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/DeclineReason' }
        comment:
          type: [string, 'null']
          maxLength: 500
          description: Обязателен при `reason = other`

    InvitationPostpone:
      type: object
      properties:
        until:
          type: [string, 'null']
          format: date
          description: До какой даты отложить (не позже `expires_at`)

    InvitationNote:
      type: object
      properties:
        note: { type: [string, 'null'], maxLength: 500 }

    InvitationStageUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [interview, offer, hired, closed]
        note: { type: [string, 'null'], maxLength: 500 }

    InvitationStats:
      type: object
      required: [days, funnel, decline_reasons, acceptance_rate, median_response_hours]
      properties:
        days: { type: integer }
        funnel:
          type: object
          required: [sent, viewed, accepted, declined, postponed, expired, withdrawn, interview, offer, hired]
          properties:
            sent: { type: integer }
            viewed: { type: integer }
            accepted: { type: integer }
            declined: { type: integer }
            postponed: { type: integer }
            expired: { type: integer }
            withdrawn: { type: integer }
            interview: { type: integer }
            offer: { type: integer }
            hired: { type: integer }
        decline_reasons:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: { $ref: '#/components/schemas/DeclineReason' }
              count: { type: integer }
        acceptance_rate: { type: number, minimum: 0, maximum: 1 }
        median_response_hours: { type: [number, 'null'] }

    # ───────────── vacancies ─────────────
    VacancyBrief:
      type: object
      required: [id, title, company]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        company: { $ref: '#/components/schemas/CompanyBrief' }

    Vacancy:
      type: object
      required: [id, company, title, description, specialization, grade, must_skills, nice_skills, work_format, city, salary, status, published_at, created_at, applications_count, my_application, match]
      properties:
        id: { type: string, format: uuid }
        company: { $ref: '#/components/schemas/CompanyBrief' }
        title: { type: string, examples: [Middle Go-разработчик (платежи)] }
        description: { type: string }
        specialization: { $ref: '#/components/schemas/Specialization' }
        grade: { $ref: '#/components/schemas/Grade' }
        must_skills:
          type: array
          items: { $ref: '#/components/schemas/SkillRef' }
        nice_skills:
          type: array
          items: { $ref: '#/components/schemas/SkillRef' }
        work_format: { $ref: '#/components/schemas/WorkFormat' }
        city: { type: [string, 'null'] }
        salary: { $ref: '#/components/schemas/SalaryRange' }
        status: { $ref: '#/components/schemas/VacancyStatus' }
        published_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        applications_count:
          type: [integer, 'null']
          description: Только для работодателя-владельца
        my_application:
          description: Только для кандидата
          oneOf:
            - type: object
              required: [id, status]
              properties:
                id: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/ApplicationStatus' }
            - type: 'null'
        match:
          description: Соответствие профилю кандидата (только для кандидата с подтверждённым грейдом)
          oneOf:
            - type: object
              required: [score, chips]
              properties:
                score: { type: number, minimum: 0, maximum: 100 }
                chips:
                  type: array
                  items: { $ref: '#/components/schemas/ExplanationFactor' }
            - type: 'null'

    VacancyInput:
      type: object
      required: [title, description, specialization, grade, must_skills, nice_skills, work_format, city, salary, status]
      properties:
        title: { type: string, minLength: 5, maxLength: 120 }
        description: { type: string, minLength: 50, maxLength: 5000 }
        specialization: { $ref: '#/components/schemas/Specialization' }
        grade: { $ref: '#/components/schemas/Grade' }
        must_skills:
          type: array
          minItems: 1
          maxItems: 15
          items: { type: string }
        nice_skills:
          type: array
          maxItems: 15
          items: { type: string }
        work_format: { $ref: '#/components/schemas/WorkFormat' }
        city: { type: [string, 'null'] }
        salary: { $ref: '#/components/schemas/SalaryRange' }
        status: { $ref: '#/components/schemas/VacancyStatus' }

    VacancyPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Vacancy' }

    ApplicationEvent:
      type: object
      required: [at, status, actor, note]
      properties:
        at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        actor:
          type: string
          enum: [candidate, employer, system]
        note: { type: [string, 'null'] }

    Application:
      type: object
      required: [id, vacancy, status, cover_letter, created_at, updated_at, events]
      properties:
        id: { type: string, format: uuid }
        vacancy: { $ref: '#/components/schemas/VacancyBrief' }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        cover_letter: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        events:
          type: array
          items: { $ref: '#/components/schemas/ApplicationEvent' }

    EmployerApplication:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          required: [candidate, explanation]
          properties:
            candidate:
              $ref: '#/components/schemas/CandidateCard'
              description: Контакты раскрыты (отклик = согласие на раскрытие этой компании)
            explanation: { $ref: '#/components/schemas/MatchExplanation' }

    ApplicationCreate:
      type: object
      properties:
        cover_letter: { type: [string, 'null'], maxLength: 2000 }

    ApplicationStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [viewed, interview, offer, hired, rejected]
        note: { type: [string, 'null'], maxLength: 500 }

    # ───────────── tasks ─────────────
    RubricCriterion:
      type: object
      required: [criterion, weight]
      properties:
        criterion: { type: string, minLength: 3, maxLength: 200, examples: [Корректность на граничных случаях] }
        weight:
          type: number
          minimum: 0
          maximum: 1

    RegularTask:
      type: object
      required: [id, company, title, description, kind, specializations, grades, time_limit_min, language, starter_code, rubric, status, published_at, deadline_at, assigned_count, submissions_count]
      properties:
        id: { type: string, format: uuid }
        company: { $ref: '#/components/schemas/CompanyBrief' }
        title: { type: string, examples: [Идемпотентный обработчик платежа] }
        description: { type: string }
        kind: { $ref: '#/components/schemas/TaskKind' }
        specializations:
          type: array
          items: { $ref: '#/components/schemas/Specialization' }
        grades:
          type: array
          items: { $ref: '#/components/schemas/Grade' }
        time_limit_min:
          type: integer
          minimum: 5
          maximum: 30
        language:
          oneOf:
            - $ref: '#/components/schemas/CodeLanguage'
            - type: 'null'
        starter_code: { type: [string, 'null'] }
        rubric:
          type: array
          items: { $ref: '#/components/schemas/RubricCriterion' }
        status:
          type: string
          enum: [active, closed]
        published_at: { type: [string, 'null'], format: date-time }
        deadline_at: { type: string, format: date-time }
        assigned_count:
          type: [integer, 'null']
          description: Только для работодателя
        submissions_count:
          type: [integer, 'null']
          description: Только для работодателя

    RegularTaskInput:
      type: object
      required: [title, description, kind, specializations, grades, time_limit_min, language, starter_code, rubric, deadline_at]
      properties:
        title: { type: string, minLength: 5, maxLength: 120 }
        description: { type: string, minLength: 30, maxLength: 4000 }
        kind: { $ref: '#/components/schemas/TaskKind' }
        specializations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Specialization' }
        grades:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Grade' }
        time_limit_min:
          type: integer
          minimum: 5
          maximum: 30
        language:
          oneOf:
            - $ref: '#/components/schemas/CodeLanguage'
            - type: 'null'
        starter_code: { type: [string, 'null'], maxLength: 10000 }
        rubric:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/RubricCriterion' }
        deadline_at: { type: string, format: date-time }

    TaskSubmission:
      type: object
      required: [id, task_id, submitted_at, answer_text, code, language, status, llm_score, final_score, fresh_signal, feedback]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        submitted_at: { type: string, format: date-time }
        answer_text: { type: [string, 'null'] }
        code: { type: [string, 'null'] }
        language:
          oneOf:
            - $ref: '#/components/schemas/CodeLanguage'
            - type: 'null'
        status:
          type: string
          enum: [pending, scored]
        llm_score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Предварительная оценка по рубрике (LLM)
        final_score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Итоговая оценка работодателя
        fresh_signal:
          type: boolean
          description: Решение дало бейдж «свежий сигнал»
        feedback: { type: [string, 'null'] }

    TaskSubmissionCreate:
      type: object
      description: Нужно хотя бы одно из `answer_text`, `code`
      properties:
        answer_text: { type: [string, 'null'], maxLength: 4000 }
        code: { type: [string, 'null'], maxLength: 20000 }
        language:
          oneOf:
            - $ref: '#/components/schemas/CodeLanguage'
            - type: 'null'

    TaskAssignment:
      type: object
      required: [task, status, assigned_at, due_at, submission]
      properties:
        task: { $ref: '#/components/schemas/RegularTask' }
        status: { $ref: '#/components/schemas/TaskAssignmentStatus' }
        assigned_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        submission:
          oneOf:
            - $ref: '#/components/schemas/TaskSubmission'
            - type: 'null'

    EmployerTaskSubmission:
      allOf:
        - $ref: '#/components/schemas/TaskSubmission'
        - type: object
          required: [candidate]
          properties:
            candidate: { $ref: '#/components/schemas/CandidateCard' }

    TaskScore:
      type: object
      required: [final_score]
      properties:
        final_score: { type: integer, minimum: 0, maximum: 100 }
        feedback: { type: [string, 'null'], maxLength: 2000 }

    # ───────────── service ─────────────
    ProfileVerification:
      type: object
      required: [valid, full_name, category, percentile, confirmed_at, fsp_achievements_count, issued_at]
      properties:
        valid: { type: boolean }
        full_name: { type: string }
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        percentile: { type: [integer, 'null'] }
        confirmed_at: { type: [string, 'null'], format: date-time }
        fsp_achievements_count: { type: integer }
        issued_at: { type: string, format: date-time }

    EvalRankRequest:
      type: object
      required: [vacancies, candidates]
      properties:
        top_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        vacancies:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [id, text]
            properties:
              id: { type: string }
              text: { type: string, maxLength: 8000 }
              salary:
                oneOf:
                  - $ref: '#/components/schemas/SalaryRange'
                  - type: 'null'
        candidates:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: object
            required: [id, text]
            properties:
              id: { type: string }
              text:
                type: string
                maxLength: 20000
                description: Текст резюме или JSON Resume, сериализованный в строку
              grade:
                oneOf:
                  - $ref: '#/components/schemas/Grade'
                  - type: 'null'

    EvalRankResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [vacancy_id, ranking]
            properties:
              vacancy_id: { type: string }
              ranking:
                type: array
                items:
                  type: object
                  required: [candidate_id, score, factors]
                  properties:
                    candidate_id: { type: string }
                    score: { type: number }
                    factors:
                      type: array
                      items: { $ref: '#/components/schemas/ExplanationFactor' }
