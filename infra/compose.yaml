name: scout
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: scout
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:8025:8025"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: scout
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
  migrate:
    build:
      context: ../backend
      target: migrate
    environment:
      DATABASE_URL: postgresql://scout:${POSTGRES_PASSWORD}@postgres:5432/scout
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  seed:
    build:
      context: ../backend
      target: migrate
    command: ["npm", "run", "seed:demo"]
    environment:
      DATABASE_URL: postgresql://scout:${POSTGRES_PASSWORD}@postgres:5432/scout
      OIDC_ISSUER: http://localhost:8080/realms/scout
      SEED_PER_CATEGORY: ${SEED_PER_CATEGORY:-15}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
  api:
    build:
      context: ../backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://scout:${POSTGRES_PASSWORD}@postgres:5432/scout
      REDIS_URL: redis://redis:6379
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/scout}
      OIDC_JWKS_URL: http://keycloak:8080/realms/scout/protocol/openid-connect/certs
      OIDC_AUDIENCE: scout-api
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
      PUBLIC_VERIFICATION_BASE_URL: ${PUBLIC_VERIFICATION_BASE_URL:-http://localhost:8081}
      FSP_WEBHOOK_SECRET: ${FSP_WEBHOOK_SECRET:?Set FSP_WEBHOOK_SECRET}
      ASSESSMENT_GRADE_POLICY: ${ASSESSMENT_GRADE_POLICY:-}
      ASSESSMENT_EXPRESS: ${ASSESSMENT_EXPRESS:-false}
      PISTON_EXECUTE_URL: ${PISTON_EXECUTE_URL:-}
      PISTON_PYTHON_VERSION: ${PISTON_PYTHON_VERSION:-}
      PISTON_JAVASCRIPT_VERSION: ${PISTON_JAVASCRIPT_VERSION:-}
      PISTON_GO_VERSION: ${PISTON_GO_VERSION:-}
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports: ["127.0.0.1:8000:8000"]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  worker:
    build:
      context: ../backend
      target: runtime
    command: ["node", "dist/worker.js"]
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/scout}
      KEYCLOAK_INTERNAL_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: scout
      KEYCLOAK_ERASURE_CLIENT_ID: ${KEYCLOAK_ERASURE_CLIENT_ID:-}
      KEYCLOAK_ERASURE_CLIENT_SECRET: ${KEYCLOAK_ERASURE_CLIENT_SECRET:-}
      DATABASE_URL: postgresql://scout:${POSTGRES_PASSWORD}@postgres:5432/scout
      REDIS_URL: redis://redis:6379
      PISTON_EXECUTE_URL: ${PISTON_EXECUTE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 32
    stop_grace_period: 30s
  web:
    build:
      context: ../frontend
      args:
        VITE_OIDC_AUTHORITY: ${OIDC_ISSUER:-http://localhost:8080/realms/scout}
        VITE_ASSESSMENT_EXPRESS: ${ASSESSMENT_EXPRESS:-false}
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:8081:80"]
volumes:
  postgres:
  redis:
